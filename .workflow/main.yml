                  fun bindSlider(seek: SeekBar, label: TextView, prefKey: String, minVal: Double, maxVal: Double, step: Double, startVal: Double, format: (Double) -> String, apply: (Double) -> Unit) {
                      val prefs = getSharedPreferences("stackr_limits", MODE_PRIVATE)
                      var value = prefs.getFloat(prefKey, startVal.toFloat()).toDouble()
                      if (value < minVal) value = minVal
                      if (value > maxVal) value = maxVal
                      apply(value)
                      val steps = ((maxVal - minVal) / step).toInt()
                      seek.max = steps
                      seek.progress = ((value - minVal) / step).toInt()
                      label.text = format(value)
                      seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              val v = minVal + p * step
                              label.text = format(v)
                              apply(v)
                              prefs.edit().putFloat(prefKey, v.toFloat()).apply()
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
