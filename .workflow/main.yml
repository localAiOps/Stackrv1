              private fun openOverlayPermissionSettings() {
                  // v2.3.2 (#2): launched through the result launcher so a
                  // deny is observed and the switch is reverted.
                  overlayPermissionLauncher.launch(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) localTts?.language = Locale.US
              }

              override fun onResume() {
                  super.onResume()
                  // v2.3.2 (#2): if the permission was revoked while the app
                  // was backgrounded, drop the overlay intent so the switch
                  // cannot claim On with no permission behind it.
                  if (!Settings.canDrawOverlays(this) && StackrOverlayManager.isOverlayEnabled) {
                      StackrOverlayManager.isOverlayEnabled = false
                  }
                  if (Settings.canDrawOverlays(this) && StackrOverlayManager.isOverlayEnabled) StackrOverlayManager.show(this)
                  refreshUi()
              }

              private fun requestGpsUpdates() {
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), 101)
                      RouteStackEngine.mileageAvailable = false
                      RouteStackEngine.mileageStatus = "location off"
                      return
                  }
                  // Background location keeps the mileage tracker fed while the
                  // driver is in Maps / the delivery apps. If denied, mileage
                  // shows "location off" and everything else still works.
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q &&
                      ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_BACKGROUND_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.ACCESS_BACKGROUND_LOCATION), 102)
                  }
                  try {
                      val lm = getSystemService(LOCATION_SERVICE) as LocationManager
                      lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 5000L, 25f, LocationListener { loc ->
                          RouteStackEngine.driverLat = loc.latitude
                          RouteStackEngine.driverLng = loc.longitude
                      })
                  } catch (_: Exception) {}
              }

              private fun runNextSimulationPing() {
                  simStep = (simStep % 4) + 1
                  when (simStep) {
                      1 -> {
                          RouteStackEngine.resetRoute()
                          RouteStackEngine.flexBlock = null
                          RouteStackEngine.isReturnMode = false
                          RouteStackEngine.driverLat = 39.9612
                          RouteStackEngine.driverLng = -82.9988
                          val res = RouteStackEngine.evaluateStructuredOffer("DoorDash", 22.50, 11.2, 22.0, "Short North", "Westerville", 14.0, 42.0)
                          StackrEvents.postLog("[SIM 1: ${res.verdict}] ${res.reason}")
                          localTts?.speak(res.ttsSpeech, TextToSpeech.QUEUE_FLUSH, null, "SIM")
                          StackrOverlayManager.showVerdictFlash(this, res, onConfirmAutoAccept = {
                              RouteStackEngine.commitPendingCandidate(res.orderId)
                              runOnUiThread { refreshUi() }
                          }, onManualConfirm = {
                              RouteStackEngine.commitPendingCandidate(res.orderId)
                              runOnUiThread { refreshUi() }
                          })
                      }
                      2 -> {
                          if (RouteStackEngine.activeWaypoints.firstOrNull()?.stopType == "PICKUP") RouteStackEngine.completeNextStop()
                          RouteStackEngine.driverLat = 40.0280
                          RouteStackEngine.driverLng = -83.0180
                          // SIM 2: cross-app add-on — GrubHub joins the DoorDash anchor on one route.
                          val res = RouteStackEngine.evaluateStructuredOffer("GrubHub", 8.50, 7.4, 16.0, "Clintonville", "Westerville", 15.0, 38.0)
                          StackrEvents.postLog("[SIM 2: ${res.verdict}] ${res.reason}")
                          localTts?.speak(res.ttsSpeech, TextToSpeech.QUEUE_FLUSH, null, "SIM")
                          StackrOverlayManager.showVerdictFlash(this, res, onConfirmAutoAccept = {
                              RouteStackEngine.commitPendingCandidate(res.orderId)
                              runOnUiThread { refreshUi() }
                          }, onManualConfirm = {
                              RouteStackEngine.commitPendingCandidate(res.orderId)
                              runOnUiThread { refreshUi() }
                          })
                      }
                      3 -> {
                          // SIM 3: third app joins a two-app route - UberEats stacks onto DD + GH (three-app limit).
                          val res = RouteStackEngine.evaluateStructuredOffer("UberEats", 11.00, 9.0, 19.0, "Hilliard", "Grove City", 15.0, 35.0)
                          StackrEvents.postLog("[SIM 3: ${res.verdict}] ${res.reason}")
                          localTts?.speak(res.ttsSpeech, TextToSpeech.QUEUE_FLUSH, null, "SIM")
                          StackrOverlayManager.showVerdictFlash(this, res, null)
                      }
                      4 -> {
                          // SIM 4: Flex pre-block stack — Lockbourne block starts in 2h;
                          // a DoorDash offer ending at Lockbourne before the block stacks with a FLEX badge.
                          RouteStackEngine.resetRoute()
                          RouteStackEngine.flexBlock = null
                          RouteStackEngine.isReturnMode = false
                          RouteStackEngine.driverLat = 39.9612
                          RouteStackEngine.driverLng = -82.9988
                          val nowMs = System.currentTimeMillis()
                          RouteStackEngine.startFlexBlock("Lockbourne VOH3", nowMs + 120L * 60_000L, nowMs + 300L * 60_000L, 96.00)
                          val res = RouteStackEngine.evaluateStructuredOffer("DoorDash", 12.00, 6.0, 15.0, "Short North", "Lockbourne", 14.0, 38.0)
                          StackrEvents.postLog("[SIM 4: ${res.verdict}] ${res.reason}")
                          localTts?.speak(res.ttsSpeech, TextToSpeech.QUEUE_FLUSH, null, "SIM")
                          StackrOverlayManager.showVerdictFlash(this, res, onConfirmAutoAccept = {
                              RouteStackEngine.commitPendingCandidate(res.orderId)
                              runOnUiThread { refreshUi() }
                          }, onManualConfirm = {
                              RouteStackEngine.commitPendingCandidate(res.orderId)
                              runOnUiThread { refreshUi() }
                          })
                      }
                  }
                  refreshUi()
              }

              private fun parseBlockTime(text: String): Long? {
                  if (text.isBlank()) return null
                  for (pattern in listOf("h:mm a", "HH:mm", "h:mm")) {
                      try {
                          val sdf = java.text.SimpleDateFormat(pattern, Locale.US)
                          sdf.isLenient = false
                          val parsed = sdf.parse(text) ?: continue
                          val cal = java.util.Calendar.getInstance()
                          val tcal = java.util.Calendar.getInstance()
                          tcal.time = parsed
                          cal.set(java.util.Calendar.HOUR_OF_DAY, tcal.get(java.util.Calendar.HOUR_OF_DAY))
                          cal.set(java.util.Calendar.MINUTE, tcal.get(java.util.Calendar.MINUTE))
                          cal.set(java.util.Calendar.SECOND, 0)
                          cal.set(java.util.Calendar.MILLISECOND, 0)
                          return cal.timeInMillis
                      } catch (_: Exception) {}
                  }
                  return null
              }

              private fun refreshUi() {
                  val agentActive = StackrAccessibilityService.isRunning
                  statusBadge.text = if (agentActive) "● SCREEN AGENT LIVE" else "○ SCREEN AGENT OFF"
                  statusBadge.setTextColor(if (agentActive) 0xFF19C37D.toInt() else 0xFFFF4D4F.toInt())

                  val canOverlay = Settings.canDrawOverlays(this)
                  overlayBadge.text = if (canOverlay) "● FLOATING PILL READY" else "○ OVERLAY PERMISSION NEEDED"
                  overlayBadge.setTextColor(if (canOverlay) 0xFF19C37D.toInt() else 0xFFFFCC4D.toInt())

                  // v2.3.2 (#4): lastEventText is owned by the StackrEvents
                  // collector now, not by refreshUi() — the old static read
                  // is gone.
                  acceptRateText.text = RouteStackEngine.acceptanceSummaryText()
                  mileageText.text = RouteStackEngine.mileageSummaryText()
                  btnNavApp.text = "NAV: " + RouteStackEngine.navApp.uppercase(Locale.US)
                  flexStatusText.text = RouteStackEngine.flexStatusText()
                  homeStatusText.text = RouteStackEngine.homeStatusText()
                  btnPause.text = if (RouteStackEngine.isPaused) "▶ RESUME STACKR" else "⏸ PAUSE STACKR"
                  // v2.3.2 (#1): re-sync every switch from engine state on
                  // each refresh — the background service changes these and
                  // the switches used to go stale. The != guard keeps the
                  // re-sync from re-firing the checked-change listeners.
                  // The overlay switch is skipped while a permission
                  // request is in flight (overlayPermissionPending).
                  if (!overlayPermissionPending && switchOverlay.isChecked != StackrOverlayManager.isOverlayEnabled) switchOverlay.isChecked = StackrOverlayManager.isOverlayEnabled
                  if (switchAutoAccept.isChecked != RouteStackEngine.autoAcceptEnabled) switchAutoAccept.isChecked = RouteStackEngine.autoAcceptEnabled
                  if (switchWaze.isChecked != RouteStackEngine.autoLaunchWaze) switchWaze.isChecked = RouteStackEngine.autoLaunchWaze
                  if (switchDeadhead.isChecked != RouteStackEngine.deadheadMode) switchDeadhead.isChecked = RouteStackEngine.deadheadMode
                  if (switchFinishHome.isChecked != RouteStackEngine.finishCloseToHome) switchFinishHome.isChecked = RouteStackEngine.finishCloseToHome
                  btnNavigateNext.text = if (RouteStackEngine.navApp == "Waze") "NAVIGATE — NEXT STOP" else "NAVIGATE — ALL STOPS"
                  routeSummaryText.text = String.format(Locale.US, "Active Orders: %d • Apps: %s • Locked Corridor Pay: $%.2f", RouteStackEngine.activeOrderCount(), RouteStackEngine.routePlatforms().joinToString("+").ifEmpty { "—" }, RouteStackEngine.totalLockedPayout())

                  if (RouteStackEngine.activeWaypoints.isEmpty()) {
                      stopsListText.text = "No active stops. Open Waze — floating pill will track incoming pings automatically."
                  } else {
                      val now = System.currentTimeMillis()
                      stopsListText.text = RouteStackEngine.activeWaypoints.mapIndexed { idx, wp ->
                          val rem = ((wp.deadlineMs - now) / 60_000.0).toInt()
                          "${idx + 1}. [${RouteStackEngine.appBadge(wp.platform)}] [${wp.stopType}] ${wp.label} (${wp.platform}) • due in ${rem}m"
                      }.joinToString("\n")
                  }
              }

              override fun onDestroy() {
                  localTts?.shutdown()
                  super.onDestroy()
              }
          }
          '''

          for path, content in files.items():
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")
          print("Successfully generated all 20 STACKR project files.")

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload STACKR APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STACKR-Floating-Overlay-Agent-APK
          path: app/build/outputs/apk/debug/app-debug.apk
    
