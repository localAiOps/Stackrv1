          files["app/src/main/java/com/builttoearn/stackr/RouteStackEngine.kt"] = r'''package com.builttoearn.stackr

          import android.content.Context
          import java.util.Calendar
          import java.util.Locale
          import kotlin.math.*

          data class Waypoint(
              val stopId: String,
              val orderId: String,
              val platform: String,
              val stopType: String,
              val label: String,
              val lat: Double,
              val lng: Double,
              val deadlineMs: Long,
              val dwellMins: Double,
              val payout: Double = 0.0,
              val orderName: String = "",
              val hasRealCoords: Boolean = true
          )

          data class EvaluationResult(
              val verdict: String,
              val mode: String,
              val autoAccept: Boolean,
              val orderId: String,
              val payout: Double,
              val metricPerMile: Double,
              val metricPerHour: Double,
              val slaBufferMins: Double,
              val reason: String,
              val ttsSpeech: String,
              val wazeNavUrl: String,
              val optimizedStops: List<String>,
              val platform: String = "Delivery",
              val guardActive: Boolean = false,
              val guardBadge: String = "",
              val appBadge: String = "",
              val isCrossApp: Boolean = false,
              val flexBadge: String = "",
              // v2.3.3 (fix 6): drop-off area name from the offer screen
              // (matchedZones) so the verdict can announce it. Empty when
              // the gate that built this result never saw the offer text.
              val dropoffArea: String = ""
          )

          object RouteStackEngine {
              var anchorMinPerMile = 1.55
              var anchorMinPerHour = 33.00
              var marginalMinPerMile = 2.00
              var marginalMinPerHour = 38.00
              var slaSafetyBufferMins = 5.0
              var maxDetourMins = 15.0
              var maxDetourMiles = 8.0
              var maxAreaGapMiles = 10.0
              var pickupDwellMins = 5.0
              var dropoffDwellMins = 2.0
              var fallbackAvgMph = 32.0
              var roadTortuosity = 1.32
              var deadheadReturnMph = 35.0

              // --- FEATURE 1: Acceptance-rate guard (Nov 15, 2026) ---
              // Declines and let-expire/timeouts count EXACTLY the same: both
              // are declines. STACKR never auto-declines an anchor.
              var guardThresholdPct = 50.0
              var guardLoosenPerMile = 0.20
              var guardLoosenPerHour = 3.0
              var guardHardFloorPerMile = 1.00
              var guardHardFloorPerHour = 20.0
              private val acceptCounts = mutableMapOf<String, Int>()
              private val declineCounts = mutableMapOf<String, Int>()
              var onAcceptanceCountsChanged: (() -> Unit)? = null

              fun normalizedPlatform(platform: String): String = when {
                  platform.contains("doordash", ignoreCase = true) -> "DoorDash"
                  platform.contains("grubhub", ignoreCase = true) -> "GrubHub"
                  platform.contains("uber", ignoreCase = true) -> "UberEats"
                  else -> platform
              }

              // v2.3.5: TTS-friendly platform names for arrival / route
              // announcements. "UberEats" as one word mumbles in TTS and
              // "GrubHub" reads as two words - with three apps live at once
              // the platform has to land clearly on the first hearing.
              fun spokenPlatform(platform: String): String = when (normalizedPlatform(platform)) {
                  "DoorDash" -> "DoorDash"
                  "GrubHub" -> "Grubhub"
                  "UberEats" -> "Uber Eats"
                  else -> normalizedPlatform(platform)
              }

              // Small app badge on every stop so the driver knows which app
              // each stop belongs to: DD / GH / UE.
              fun appBadge(platform: String): String = when (normalizedPlatform(platform)) {
                  "DoorDash" -> "DD"
                  "GrubHub" -> "GH"
                  "UberEats" -> "UE"
                  else -> platform.take(2).uppercase(Locale.US)
              }

              fun totalAccepts(): Int = acceptCounts.values.sum()
              fun totalDeclines(): Int = declineCounts.values.sum()
              fun totalOffersTracked(): Int = totalAccepts() + totalDeclines()
              fun acceptsFor(platform: String): Int = acceptCounts[normalizedPlatform(platform)] ?: 0
              fun declinesFor(platform: String): Int = declineCounts[normalizedPlatform(platform)] ?: 0

              fun acceptanceRatePct(): Double {
                  val total = totalOffersTracked()
                  if (total == 0) return 100.0 // No history yet: guard stays off.
                  return totalAccepts().toDouble() / total.toDouble() * 100.0
              }

              fun isGuardActive(): Boolean = totalOffersTracked() > 0 && acceptanceRatePct() < guardThresholdPct

              // Loosened anchor floors while the guard is active. Never below
              // the hard floor of $1.00/mi and $20/hr.
              fun effectiveAnchorMinPerMile(): Double =
                  if (isGuardActive()) maxOf(guardHardFloorPerMile, anchorMinPerMile - guardLoosenPerMile) else anchorMinPerMile

              fun effectiveAnchorMinPerHour(): Double =
                  if (isGuardActive()) maxOf(guardHardFloorPerHour, anchorMinPerHour - guardLoosenPerHour) else anchorMinPerHour

              fun guardBadgeText(): String = if (isGuardActive()) "RATE GUARD" else ""

              fun acceptanceSummaryText(): String {
                  val rate = acceptanceRatePct()
                  val state = if (totalOffersTracked() == 0) "no offers tracked yet • Guard off"
                  else if (isGuardActive()) "guard on — floors loosened to rebuild rate"
                  else "guard off"
                  return String.format(Locale.US, "Accept rate %.0f%% — %s • DD %d/%d • GH %d/%d • UE %d/%d",
                      rate, state,
                      acceptsFor("DoorDash"), acceptsFor("DoorDash") + declinesFor("DoorDash"),
                      acceptsFor("GrubHub"), acceptsFor("GrubHub") + declinesFor("GrubHub"),
                      acceptsFor("UberEats"), acceptsFor("UberEats") + declinesFor("UberEats"))
              }

              fun recordAccept(platform: String) {
                  val key = normalizedPlatform(platform)
                  acceptCounts[key] = (acceptCounts[key] ?: 0) + 1
                  onAcceptanceCountsChanged?.invoke()
              }

              fun recordDecline(platform: String) {
                  val key = normalizedPlatform(platform)
                  declineCounts[key] = (declineCounts[key] ?: 0) + 1
                  onAcceptanceCountsChanged?.invoke()
              }

              fun recordOutcome(platform: String, accepted: Boolean) {
                  if (accepted) recordAccept(platform) else recordDecline(platform)
              }

              // Counts survive app restarts via SharedPreferences.
              fun loadAcceptanceCounts(context: Context) {
                  val prefs = context.getSharedPreferences("stackr_acceptance", Context.MODE_PRIVATE)
                  acceptCounts.clear()
                  declineCounts.clear()
                  for (app in listOf("DoorDash", "GrubHub", "UberEats")) {
                      acceptCounts[app] = prefs.getInt("accept_$app", 0)
                      declineCounts[app] = prefs.getInt("decline_$app", 0)
                  }
              }

              fun saveAcceptanceCounts(context: Context) {
                  val prefs = context.getSharedPreferences("stackr_acceptance", Context.MODE_PRIVATE)
                  val editor = prefs.edit()
                  for (app in listOf("DoorDash", "GrubHub", "UberEats")) {
                      editor.putInt("accept_$app", acceptsFor(app))
                      editor.putInt("decline_$app", declinesFor(app))
                  }
                  editor.apply()
              }

              // --- FEATURE 2: Three apps live together on one route ---
              // One route, one corridor, one SLA guard across all three apps. Never
              // run a separate guard per app, and never double-count pay or
              // miles: totalLockedPayout() sums each order's single DROPOFF
              // payout once, per distinct order.
              fun routePlatforms(): List<String> = activeWaypoints.map { normalizedPlatform(it.platform) }.distinct()
              fun anchorPlatform(): String? = activeWaypoints.firstOrNull()?.let { normalizedPlatform(it.platform) }
              fun isCrossAppCandidate(platform: String): Boolean {
                  val norm = normalizedPlatform(platform)
                  return activeWaypoints.isNotEmpty() && activeWaypoints.any { normalizedPlatform(it.platform) != norm }
              }
              fun routeHasThreeApps(): Boolean = routePlatforms().size >= 3

              // --- FEATURE 3 (v2.2): Navigation — Google Maps is the DEFAULT
              // nav app (Waze was giving problems). Maps takes ALL remaining
              // stops as waypoints in ONE directions link: origin = current
              // location, destination = last stop, waypoints = stops between
              // (max 9 intermediate waypoints). Waze has no multi-stop API:
              // it takes ONE destination per open, so Waze mode opens the
              // next stop only and auto-advances after each stop is done.
              // If a stop has no real coordinates, the nav link uses an
              // address search for that stop instead — never invent coords.
              var navApp = "Google Maps"

              fun isKnownZone(label: String): Boolean {
                  val lower = label.lowercase(Locale.US)
                  return columbusZones.keys.any { lower.contains(it) }
              }

              fun navUrlForStop(wp: Waypoint): String {
                  val labelEnc = java.net.URLEncoder.encode(wp.label, "UTF-8")
                  return if (navApp == "Waze") {
                      if (wp.hasRealCoords) "https://www.waze.com/ul?ll=${wp.lat},${wp.lng}&navigate=yes"
                      else "https://www.waze.com/ul?q=$labelEnc&navigate=yes"
                  } else {
                      if (wp.hasRealCoords) "https://www.google.com/maps/dir/?api=1&destination=${wp.lat},${wp.lng}"
                      else "https://www.google.com/maps/dir/?api=1&destination=$labelEnc"
                  }
              }

              fun navUrlForRemainingStops(): String {
                  if (activeWaypoints.isEmpty()) return ""
                  if (navApp == "Waze") return navUrlForStop(activeWaypoints.first())
                  val stops = activeWaypoints.take(10)
                  val dest = stops.last()
                  val mids = stops.dropLast(1)
                  val destParam = if (dest.hasRealCoords) "${dest.lat},${dest.lng}" else java.net.URLEncoder.encode(dest.label, "UTF-8")
                  val wpParam = mids.joinToString("|") { if (it.hasRealCoords) "${it.lat},${it.lng}" else java.net.URLEncoder.encode(it.label, "UTF-8") }
                  val base = "https://www.google.com/maps/dir/?api=1&origin=${driverLat},${driverLng}&destination=$destParam"
                  return if (wpParam.isEmpty()) base else "$base&waypoints=$wpParam"
              }

              fun navUrlForNext(): String {
                  if (activeWaypoints.isEmpty()) return ""
                  return if (navApp == "Waze") navUrlForStop(activeWaypoints.first()) else navUrlForRemainingStops()
              }

              var autoAcceptEnabled = true
              var autoLaunchWaze = true
              var deadheadMode = false
              var isRouteActive = false

              // --- FEATURE (v2.3): Amazon Flex route support ---
              // Flex blocks are picked in the Flex app — STACKR does NOT
              // read the Flex app. The driver enters the block by hand on
              // the home screen. STACKR only stacks DoorDash / GrubHub /
              // Uber Eats offers around it, and the Flex block itself is
              // NEVER auto-accepted or declined by STACKR.
              data class FlexBlock(
                  val station: String,
                  val stationLat: Double?,
                  val stationLng: Double?,
                  val startMs: Long,
                  val endMs: Long,
                  val pay: Double
              )
              var flexBlock: FlexBlock? = null
              var isReturnMode = false
              var homeLat: Double? = null
              var homeLng: Double? = null
              var homeLabel: String = ""
              var finishCloseToHome = false
              var isPaused = false
              var flexPreBlockBufferMins = 15.0
              var homeArrivalRadiusMeters = 100.0
              // Lockbourne VOH3 Flex blocks run out of the Collings Dr
              // area (6322 Collings Dr) — coords are approximate, tap
              // "Set station here" at the station to pin exact GPS.
              // UOH4 Columbus has no verified address on file, so its
              // coords stay unset until the driver pins them or types
              // an address that resolves to a known zone.
              val flexStationPresets: Map<String, Pair<Double, Double>?> = mapOf(
                  "Lockbourne VOH3" to Pair(39.8085, -82.9725),
                  "Columbus UOH4" to null
              )
              var flexStationPinLat: Double? = null
              var flexStationPinLng: Double? = null
              private var flexWarnedForStartMs: Long = -1L

              fun flexBadgeText(): String = when {
                  isReturnMode -> "RETURN"
                  flexBlock != null -> "FLEX"
                  else -> ""
              }

              fun flexStationCoords(): Pair<Double, Double>? {
                  flexStationPinLat?.let { la -> flexStationPinLng?.let { ln -> return Pair(la, ln) } }
                  val block = flexBlock ?: return null
                  return flexStationPresets[block.station]
              }

              fun flexStatusText(): String {
                  val block = flexBlock
                  return when {
                      block == null && !isReturnMode -> "No Flex block entered. Enter your block below — STACKR stacks delivery offers around it."
                      block != null -> {
                          val fmt = java.text.SimpleDateFormat("h:mm a", Locale.US)
                          val state = if (System.currentTimeMillis() < block.startMs) "starts soon" else if (System.currentTimeMillis() <= block.endMs) "BLOCK LIVE" else "block over"
                          String.format(Locale.US, "FLEX %s • %s-%s • $%.2f • %s", block.station, fmt.format(java.util.Date(block.startMs)), fmt.format(java.util.Date(block.endMs)), block.pay, state)
                      }
                      else -> "RETURN MODE — looking for orders headed home."
                  }
              }

              fun homeStatusText(): String {
                  val la = homeLat
                  val ln = homeLng
                  return if (la == null || ln == null) "Home not set. Stand at home and tap SET HOME HERE, or type your address."
                  else "Home: ${homeLabel.ifBlank { "set" }} (${String.format(Locale.US, "%.4f, %.4f", la, ln)})"
              }

              fun startFlexBlock(station: String, startMs: Long, endMs: Long, pay: Double) {
                  val coords = flexStationPinLat?.let { la -> flexStationPinLng?.let { ln -> Pair(la, ln) } } ?: flexStationPresets[station]
                  flexBlock = FlexBlock(station, coords?.first, coords?.second, startMs, endMs, pay)
                  isReturnMode = false
                  flexWarnedForStartMs = -1L
                  isRouteActive = true
                  routeMiles = 0.0
                  completedRoutePay = 0.0
                  announcedArrivals.clear()
                  lastMileageLat = null
                  lastMileageLng = null
                  routeStartLat = driverLat
                  routeStartLng = driverLng
                  onRouteActiveChanged?.invoke(true)
                  val mins = ((startMs - System.currentTimeMillis()) / 60_000L).coerceAtLeast(0L)
                  fireRouteEvent("flex:start:${startMs}", "Flex block $station starts in $mins minutes. Head to $station.")
              }

              fun endFlexBlock() {
                  val block = flexBlock ?: return
                  flexBlock = null
                  isReturnMode = true
                  logTripIfAny("Flex")
                  fireRouteEvent("flex:return:${block.endMs}", "Flex block done. Return trip mode. Looking for orders headed home.")
                  onRouteActiveChanged?.invoke(true)
              }

              fun endReturnMode() {
                  if (!isReturnMode) return
                  isReturnMode = false
                  logTripIfAny("Return")
                  if (activeWaypoints.isEmpty()) {
                      isRouteActive = false
                      onRouteActiveChanged?.invoke(false)
                  }
              }

              private fun logTripIfAny(appsLabel: String) {
                  if (routeMiles <= 0.0 && completedRoutePay <= 0.0) return
                  val today = java.text.SimpleDateFormat("yyyy-MM-dd", Locale.US).format(java.util.Date())
                  tripLog.add(TripEntry(today, appsLabel, routeMiles, completedRoutePay))
                  if (tripLog.size > 30) tripLog.removeAt(0)
                  appContext?.let { saveTripLog(it) }
                  dayPay += completedRoutePay
                  routeMiles = 0.0
                  completedRoutePay = 0.0
                  routeStartLat = null
                  routeStartLng = null
              }

              fun setHome(lat: Double, lng: Double, label: String) {
                  homeLat = lat
                  homeLng = lng
                  homeLabel = label
                  appContext?.let { saveFlexPrefs(it) }
              }

              fun loadFlexPrefs(context: Context) {
                  val prefs = context.getSharedPreferences("stackr_flex", Context.MODE_PRIVATE)
                  if (prefs.contains("home_lat")) {
                      homeLat = prefs.getFloat("home_lat", 0f).toDouble()
                      homeLng = prefs.getFloat("home_lng", 0f).toDouble()
                      homeLabel = prefs.getString("home_label", "") ?: ""
                  }
                  finishCloseToHome = prefs.getBoolean("finish_close_home", false)
                  isPaused = prefs.getBoolean("paused", false)
                  setAppContext(context)
              }

              fun saveFlexPrefs(context: Context) {
                  val prefs = context.getSharedPreferences("stackr_flex", Context.MODE_PRIVATE)
                  val editor = prefs.edit()
                  val la = homeLat
                  val ln = homeLng
                  if (la != null && ln != null) {
                      editor.putFloat("home_lat", la.toFloat())
                      editor.putFloat("home_lng", ln.toFloat())
                      editor.putString("home_label", homeLabel)
                  }
                  editor.putBoolean("finish_close_home", finishCloseToHome)
                  editor.putBoolean("paused", isPaused)
                  editor.apply()
              }

              fun setPaused(paused: Boolean, context: Context?) {
                  isPaused = paused
                  if (context != null) saveFlexPrefs(context)
              }

              // Called on every location update. Auto-switches to return
              // mode when the block ends, and warns once 30 minutes before
              // the block starts.
              fun checkFlexTimers() {
                  val block = flexBlock ?: return
                  val now = System.currentTimeMillis()
                  if (now >= block.endMs) {
                      endFlexBlock()
                      return
                  }
                  if (now >= block.startMs - 30L * 60_000L && now < block.startMs && flexWarnedForStartMs != block.startMs) {
                      flexWarnedForStartMs = block.startMs
                      val mins = ((block.startMs - now) / 60_000L).coerceAtLeast(1L)
                      fireRouteEvent("flex:warn:${block.startMs}", "Flex block starts in $mins minutes, head to ${block.station}.")
                  }
              }

              fun checkReturnArrival() {
                  if (!isReturnMode) return
                  val la = homeLat ?: return
                  val ln = homeLng ?: return
                  val distMeters = haversineMiles(driverLat, driverLng, la, ln) * 1609.34
                  if (distMeters > homeArrivalRadiusMeters) return
                  endReturnMode()
                  fireRouteEvent("flex:home", "You are home. Return trip done.")
              }

              private fun flexGateResult(mode: String, reason: String, tts: String, orderId: String, payout: Double, platform: String, slaBuffer: Double): EvaluationResult {
                  return EvaluationResult(
                      verdict = "SKIP",
                      mode = mode,
                      autoAccept = false,
                      orderId = orderId,
                      payout = payout,
                      metricPerMile = 0.0,
                      metricPerHour = 0.0,
                      slaBufferMins = slaBuffer,
                      reason = reason,
                      ttsSpeech = tts,
                      wazeNavUrl = "",
                      optimizedStops = activeWaypoints.map { "${it.stopType}: ${it.label}" },
                      platform = platform,
                      guardActive = isGuardActive(),
                      guardBadge = guardBadgeText(),
                      appBadge = appBadge(platform),
                      isCrossApp = isCrossAppCandidate(platform),
                      flexBadge = flexBadgeText()
                  )
              }

              // v2.3 Flex / return corridor gate. Returns a SKIP result when
              // the candidate does not fit the active Flex block or return
              // leg, or null when it passes. Runs BEFORE floor grading.
              fun flexCorridorGate(dropoffLat: Double, dropoffLng: Double, totalMins: Double, orderId: String, payout: Double, platform: String, nowMs: Long): EvaluationResult? {
                  val block = flexBlock
                  if (block != null) {
                      if (nowMs < block.startMs) {
                          // BEFORE the block: the offer must finish at least
                          // 15 minutes before block start, and end near the
                          // station so he is never late to check-in.
                          val finishMs = nowMs + (totalMins * 60_000.0).toLong()
                          if (finishMs > block.startMs - (flexPreBlockBufferMins * 60_000.0).toLong()) {
                              return flexGateResult("OFF_FLEX_ROUTE", "OFF FLEX ROUTE: finishes too close to block start — would risk being late to ${block.station} check-in", "Skip. That would make you late to your Flex block.", orderId, payout, platform, 0.0)
                          }
                          val coords = flexStationCoords()
                          if (coords != null) {
                              val distToStation = haversineMiles(dropoffLat, dropoffLng, coords.first, coords.second)
                              if (distToStation > maxAreaGapMiles) {
                                  return flexGateResult("OFF_FLEX_ROUTE", String.format(Locale.US, "OFF FLEX ROUTE: dropoff %.1f mi from ${block.station} — not on the way to the station", distToStation), "Skip. That heads away from your Flex station.", orderId, payout, platform, 0.0)
                              }
                          }
                      } else {
                          // DURING the block: pickup/dropoff must fall near
                          // the station, the driver, or the live route —
                          // the Flex delivery area itself is not visible to
                          // STACKR, so proximity to those three is the test.
                          val coords = flexStationCoords()
                          val nearStation = coords != null && haversineMiles(dropoffLat, dropoffLng, coords.first, coords.second) <= maxAreaGapMiles
                          val nearDriver = haversineMiles(dropoffLat, dropoffLng, driverLat, driverLng) <= maxAreaGapMiles
                          val nearRoute = activeWaypoints.any { haversineMiles(dropoffLat, dropoffLng, it.lat, it.lng) <= maxAreaGapMiles }
                          if (!nearStation && !nearDriver && !nearRoute) {
                              return flexGateResult("OFF_FLEX_ROUTE", "OFF FLEX ROUTE: dropoff is outside the Flex area around ${block.station}", "Skip. That is outside your Flex area.", orderId, payout, platform, 0.0)
                          }
                      }
                      return null
                  }
                  if (isReturnMode) {
                      val la = homeLat
                      val ln = homeLng
                      if (la != null && ln != null) {
                          val distHome = haversineMiles(dropoffLat, dropoffLng, la, ln)
                          val driverToHome = haversineMiles(driverLat, driverLng, la, ln)
                          // Heads toward home: ends near home, or ends
                          // closer to home than the driver is right now.
                          if (distHome > maxAreaGapMiles && distHome >= driverToHome) {
                              return flexGateResult("OFF_RETURN", String.format(Locale.US, "Heads away from home: dropoff %.1f mi from home", distHome), "Skip. That heads away from home.", orderId, payout, platform, 0.0)
                          }
                      }
                  }
                  return null
              }

              // "Finish close to home": when ON, the route's last stop after
              // adding this offer must end within 10 mi of home. Applies to
              // ANY route, not just Flex return trips. No home set = no
              // constraint (the toggle only bites once home is set).
              fun finishCloseGate(lastLat: Double, lastLng: Double, orderId: String, payout: Double, platform: String): EvaluationResult? {
                  if (!finishCloseToHome) return null
                  val la = homeLat ?: return null
                  val ln = homeLng ?: return null
                  val distHome = haversineMiles(lastLat, lastLng, la, ln)
                  if (distHome > maxAreaGapMiles) {
                      return flexGateResult("ENDS_FAR_FROM_HOME", String.format(Locale.US, "ENDS FAR FROM HOME: route would end %.1f mi from home", distHome), "Skip. That order would leave you ending far from home.", orderId, payout, platform, 0.0)
                  }
                  return null
              }

