                  bindSlider(seekDetourMins, valDetourMins, "detour_mins", 0.0, 30.0, 1.0, RouteStackEngine.maxDetourMins, { v -> "${v.toInt()} min" }, { v -> RouteStackEngine.maxDetourMins = v })
