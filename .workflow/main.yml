              fun activeOrderCount(): Int = activeWaypoints.map { it.orderId }.distinct().size
              fun totalLockedPayout(): Double = activeWaypoints.filter { it.stopType == "DROPOFF" }.sumOf { it.payout }

              // --- FEATURE 1 (v2.2): Mileage tracker ---
              // GPS miles accumulate while a route is active, fed by
              // MileageService (FusedLocationProviderClient, foreground
              // service). Fixes more than 2 miles apart are treated as GPS
              // noise and ignored; sub-10 m jitter is ignored too. The day
              // total and a 30-trip log survive restarts (SharedPreferences).
              // If location is denied, mileage shows "location off" and
              // everything else keeps working — offers are never blocked.
              var routeMiles = 0.0
              var dayMiles = 0.0
              var dayPay = 0.0
              var mileageAvailable = false
              var mileageStatus = "location off"
              var arrivalRadiusMeters = 100.0
              var onMileageChanged: (() -> Unit)? = null
              var onRouteEvent: ((String) -> Unit)? = null
              var onRouteActiveChanged: ((Boolean) -> Unit)? = null
              private var lastMileageLat: Double? = null
              private var lastMileageLng: Double? = null
              private var routeStartLat: Double? = null
              private var routeStartLng: Double? = null
              private var lastTripDate = ""
              private var completedRoutePay = 0.0
              private var lastGuardState = false
              private val announcedArrivals = mutableSetOf<String>()
              // v2.3.3 (fix 3): history of completed stops so BACK can undo
              // the last advance (pill tap or completion screen). Bounded
              // so an all-day run cannot grow it without limit.
              private val completedStopHistory = ArrayDeque<Waypoint>()
              private var lastCompletedRouteMiles = 0.0
              private var lastCompletedRoutePay = 0.0
              private var lastCompletedWasRouteEnd = false
              // v2.3.3 (fix 4): fired whenever the stop list changes so the
              // floating pill can re-render after an auto-advance.
              var onStopsChanged: (() -> Unit)? = null
              private val announcedRouteEvents = mutableMapOf<String, Long>()
              private var appContext: Context? = null
              private val tripLog = mutableListOf<TripEntry>()

              data class TripEntry(val date: String, val apps: String, val miles: Double, val pay: Double)

              fun setAppContext(context: Context) { appContext = context.applicationContext }

              fun mileageSummaryText(): String {
                  return if (!mileageAvailable) String.format(Locale.US, "Route miles: %.1f • Today: %.1f mi • $%.2f (location off — mileage paused)", routeMiles, dayMiles, dayPay)
                  else String.format(Locale.US, "Route miles: %.1f • Today: %.1f mi • $%.2f", routeMiles, dayMiles, dayPay)
              }

              fun onLocationUpdate(lat: Double, lng: Double) {
                  driverLat = lat
                  driverLng = lng
                  mileageAvailable = true
                  mileageStatus = "tracking"
                  val prevLat = lastMileageLat
                  val prevLng = lastMileageLng
                  lastMileageLat = lat
                  lastMileageLng = lng
                  if (prevLat == null || prevLng == null) return
                  val leg = haversineMiles(prevLat, prevLng, lat, lng)
                  if (leg > 2.0 || leg < 0.006) return
                  if (isRouteActive) {
                      routeMiles += leg
                      dayMiles += leg
                      onMileageChanged?.invoke()
                  }
                  checkArrival()
                  checkFlexTimers()
                  checkReturnArrival()
              }

              // --- FEATURE 4 (v2.2): Arrival voice alert ---
              // Within 100 m of the next pickup/dropoff, speak ONCE, in
              // short sentences so each piece lands while driving with
              // three apps live at once:
              //   "Arrived. Uber Eats. Dropoff. Order for Sarah."
              //   "Arrived. DoorDash. Pickup. Grandma's Pizza and Pasta."
              // The platform is spoken with spaces ("Uber Eats", not
              // "UberEats"). Pickup speaks the restaurant name, dropoff
              // speaks the customer name. Both come from the offer text;
              // when no name is in the offer data, the stop label is
              // spoken and the gap is said out loud ("No customer name
              // on the offer") instead of silently passing the label
              // off as a name. NEVER invent a name.
              fun checkArrival() {
                  val next = activeWaypoints.firstOrNull() ?: return
                  val distMeters = haversineMiles(driverLat, driverLng, next.lat, next.lng) * 1609.34
                  if (distMeters > arrivalRadiusMeters) return
                  if (!announcedArrivals.add(next.stopId)) return
                  val spoken = spokenPlatform(next.platform)
                  val msg = if (next.orderName.isNotBlank()) {
                      if (next.stopType == "DROPOFF") "Arrived. $spoken. Dropoff. Order for ${next.orderName}."
                      else "Arrived. $spoken. Pickup. ${next.orderName}."
                  } else {
                      if (next.stopType == "DROPOFF") "Arrived. $spoken. Dropoff. ${next.label}. No customer name on the offer."
                      else "Arrived. $spoken. Pickup. ${next.label}. No restaurant name on the offer."
                  }
                  fireRouteEvent("arrived:${next.stopId}", msg)
                  // v2.3.3 corrected Nov 17 (Travis): arrival ANNOUNCES only.
                  // The app NEVER completes a stop by itself — completing a
                  // stop is the driver's tap on Complete Stop. No auto-advance.
              }

              // Route-update voice: one short line per event, deduped by key
              // (same 60 s expiry as the verdict voice). Route events only.
              fun fireRouteEvent(key: String, message: String) {
                  val now = System.currentTimeMillis()
                  val last = announcedRouteEvents[key]
                  if (last != null && (now - last) < 60_000L) return
                  announcedRouteEvents[key] = now
                  onRouteEvent?.invoke(message)
              }

              fun checkGuardTransition() {
                  val active = isGuardActive()
                  if (active == lastGuardState) return
                  lastGuardState = active
                  if (totalOffersTracked() == 0) return
                  fireRouteEvent("guard:${if (active) "on" else "off"}",
                      if (active) "Rate guard on. Floors loosened to rebuild accept rate." else "Rate guard off. Normal floors.")
              }

              fun loadTripLog(context: Context) {
                  val prefs = context.getSharedPreferences("stackr_trips", Context.MODE_PRIVATE)
                  tripLog.clear()
                  val raw = prefs.getString("trips", "") ?: ""
                  for (line in raw.lines()) {
                      if (line.isBlank()) continue
                      val parts = line.split("|")
                      if (parts.size == 4) tripLog.add(TripEntry(parts[0], parts[1], parts[2].toDoubleOrNull() ?: 0.0, parts[3].toDoubleOrNull() ?: 0.0))
                  }
                  // Only seed the day totals from the log on first load, so a
                  // later reload never wipes miles driven live since startup.
                  if (dayMiles == 0.0 && dayPay == 0.0) {
                      val today = java.text.SimpleDateFormat("yyyy-MM-dd", Locale.US).format(java.util.Date())
                      dayMiles = tripLog.filter { it.date == today }.sumOf { it.miles }
                      dayPay = tripLog.filter { it.date == today }.sumOf { it.pay }
                      lastTripDate = today
                  }
              }

              fun saveTripLog(context: Context) {
                  val prefs = context.getSharedPreferences("stackr_trips", Context.MODE_PRIVATE)
                  val raw = tripLog.takeLast(30).joinToString("\n") { "${it.date}|${it.apps}|${it.miles}|${it.pay}" }
                  prefs.edit().putString("trips", raw).apply()
              }

              // Best-effort name extraction from offer screen text. Returns ""
              // when nothing matches — the arrival voice then falls back to
              // the stop label instead of guessing a name.
              fun extractOrderName(rawText: String, stopType: String): String {
                  val clean = rawText.replace("\\s+".toRegex(), " ").trim()
                  val patterns = if (stopType == "DROPOFF") listOf(
                      Regex("""(?i)deliver to ([A-Z][A-Za-z'’-]{1,20})"""),
                      Regex("""(?i)customer\s*:?\s*([A-Z][A-Za-z'’-]{1,20})""")
                  ) else listOf(
                      Regex("""(?i)pickup from ([A-Z][A-Za-z0-9 &'’-]{2,30}?)(?:\s+•|\s+pickup|\s+\$|$)"""),
                      Regex("""(?i)from ([A-Z][A-Za-z0-9 &'’-]{2,30}?)(?:\s+•|\s+\$|$)""")
                  )
                  for (pattern in patterns) {
                      val m = pattern.find(clean) ?: continue
                      val name = m.groupValues[1].trim().trimEnd('.', ',')
                      if (name.isBlank()) continue
                      val lowerName = name.lowercase(Locale.US)
                      if (lowerName.contains("doordash") || lowerName.contains("grubhub") || lowerName.contains("uber")) continue
                      return name
                  }
                  return ""
              }

              fun haversineMiles(lat1: Double, lng1: Double, lat2: Double, lng2: Double): Double {
                  val r = 3958.8
                  val phi1 = Math.toRadians(lat1)
                  val phi2 = Math.toRadians(lat2)
                  val dPhi = Math.toRadians(lat2 - lat1)
                  val dLambda = Math.toRadians(lng2 - lng1)
                  val a = sin(dPhi / 2).pow(2.0) + cos(phi1) * cos(phi2) * sin(dLambda / 2).pow(2.0)
                  return 2.0 * r * atan2(sqrt(a), sqrt(1.0 - a))
              }

              fun routeLeg(lat1: Double, lng1: Double, lat2: Double, lng2: Double): Pair<Double, Double> {
                  if (abs(lat1 - lat2) < 1e-5 && abs(lng1 - lng2) < 1e-5) return Pair(0.0, 0.0)
                  val crow = haversineMiles(lat1, lng1, lat2, lng2)
                  val miles = crow * roadTortuosity
                  val mins = (miles / fallbackAvgMph) * 60.0
                  return Pair(miles, mins)
              }

              fun resolveCoords(label: String?, fallbackLat: Double, fallbackLng: Double): Pair<Double, Double> {
                  if (label.isNullOrBlank()) return Pair(fallbackLat, fallbackLng)
                  val lower = label.trim().lowercase(Locale.US)
                  columbusZones[lower]?.let { return it }
                  for ((zone, coords) in columbusZones) {
                      if (lower.contains(zone)) return coords
                  }
                  return Pair(fallbackLat, fallbackLng)
              }

              private data class SimStats(
                  val totalMiles: Double,
                  val totalMins: Double,
                  val minSlackMins: Double,
                  val slaSafe: Boolean
              )

              private fun simulateSequence(seq: List<Waypoint>, nowMs: Long): SimStats {
                  var curLat = driverLat
                  var curLng = driverLng
                  var curT = nowMs.toDouble()
                  var totalMiles = 0.0
                  var minSlack = Double.POSITIVE_INFINITY

                  for (wp in seq) {
                      val (legMi, legMin) = routeLeg(curLat, curLng, wp.lat, wp.lng)
                      totalMiles += legMi
                      curT += legMin * 60_000.0
                      val slackMins = (wp.deadlineMs - curT) / 60_000.0
                      if (slackMins < minSlack) minSlack = slackMins
                      curT += wp.dwellMins * 60_000.0
                      curLat = wp.lat
                      curLng = wp.lng
                  }

                  val totalMins = (curT - nowMs) / 60_000.0
                  val effectiveSlack = if (minSlack.isInfinite()) 99.0 else minSlack
                  return SimStats(totalMiles, totalMins, effectiveSlack, effectiveSlack >= slaSafetyBufferMins)
              }

              // v2.3.1 PERF: lazy backtracking over stop orderings. Yields
              // only sequences where every dropoff comes after its own
              // pickup, pruning an invalid branch the moment a dropoff
              // precedes its pickup. The old permutations() built the
              // FULL list first — 8 stops = 40,320 lists in memory at
              // once before any filtering ran. This streams one valid
              // sequence at a time and never materializes the list.
              private fun validSequences(stops: List<Waypoint>): Sequence<List<Waypoint>> = sequence {
                  val used = BooleanArray(stops.size)
                  val pickedUp = mutableSetOf<String>()
                  val current = ArrayList<Waypoint>(stops.size)
                  suspend fun SequenceScope<List<Waypoint>>.dfs() {
                      if (current.size == stops.size) {
                          yield(ArrayList(current))
                          return
                      }
                      for (i in stops.indices) {
                          if (used[i]) continue
                          val wp = stops[i]
                          if (wp.stopType == "DROPOFF" && wp.orderId !in pickedUp) continue
                          used[i] = true
                          current.add(wp)
                          if (wp.stopType == "PICKUP") pickedUp.add(wp.orderId)
                          dfs()
                          if (wp.stopType == "PICKUP") pickedUp.remove(wp.orderId)
                          current.removeAt(current.size - 1)
                          used[i] = false
                      }
                  }
                  dfs()
              }

              fun evaluateRawScreenText(rawText: String, packageName: String, nowMs: Long = System.currentTimeMillis()): EvaluationResult? {
                  // v2.3 PAUSE: while paused, live offers are not evaluated
                  // at all — no flash, no verdict, no accept/decline record.
                  if (isPaused) return null
                  val clean = rawText.replace("\\s+".toRegex(), " ").trim()
                  val lower = clean.lowercase(Locale.US)
                  val platform = when {
                      packageName.contains("doordash") || lower.contains("dasher") -> "DoorDash"
                      packageName.contains("grubhub") || lower.contains("grubhub") -> "GrubHub"
                      packageName.contains("uber") -> "UberEats"
                      else -> "Delivery"
                  }
                  val payMatch = Regex("""\$\s*(\d+(?:\.\d{1,2})?)""").find(clean) ?: return null
                  val payout = payMatch.groupValues[1].toDoubleOrNull() ?: return null
                  if (payout <= 0.0) return null

                  val miMatch = Regex("""(\d+(?:\.\d+)?)\s*(?:mi|miles?)\b""").find(lower)
                  val standaloneMiles = miMatch?.groupValues?.get(1)?.toDoubleOrNull() ?: 0.0
                  val minMatch = Regex("""(\d+)\s*(?:min|mins|minutes?)\b""").find(lower)
                  val standaloneMins = minMatch?.groupValues?.get(1)?.toDoubleOrNull()
                      ?: if (standaloneMiles > 0) (standaloneMiles / fallbackAvgMph) * 60.0 else 0.0

                  val matchedZones = columbusZones.keys.filter { lower.contains(it) }
                  val pickupLabel = matchedZones.getOrNull(0)?.replaceFirstChar { it.uppercase() } ?: "Pickup"
                  val dropoffLabel = matchedZones.getOrNull(1)?.replaceFirstChar { it.uppercase() } ?: pickupLabel

                  return evaluateStructuredOffer(
                      platform = platform,
                      payout = payout,
                      standaloneMiles = standaloneMiles,
                      standaloneMins = standaloneMins,
                      pickupLabel = pickupLabel,
                      dropoffLabel = dropoffLabel,
                      pickupDueMins = 12.0,
                      dropoffDueMins = max(standaloneMins + 12.0, 28.0),
                      pickupName = extractOrderName(clean, "PICKUP"),
                      dropoffName = extractOrderName(clean, "DROPOFF"),
                      nowMs = nowMs
                  )
              }

              fun evaluateStructuredOffer(
                  platform: String,
                  payout: Double,
                  standaloneMiles: Double,
                  standaloneMins: Double,
                  pickupLabel: String,
                  dropoffLabel: String,
                  pickupDueMins: Double = 14.0,
                  dropoffDueMins: Double = 38.0,
                  pickupName: String = "",
                  dropoffName: String = "",
                  nowMs: Long = System.currentTimeMillis()
              ): EvaluationResult {
                  val (pLat, pLng) = resolveCoords(pickupLabel, driverLat, driverLng)
                  val (dLat, dLng) = resolveCoords(dropoffLabel, pLat, pLng)

                  var estMiles = standaloneMiles
                  var estMins = standaloneMins
                  if (estMiles <= 0.0) {
                      val (l1Mi, l1Min) = routeLeg(driverLat, driverLng, pLat, pLng)
                      val (l2Mi, l2Min) = routeLeg(pLat, pLng, dLat, dLng)
                      estMiles = max(0.5, l1Mi + l2Mi)
                      estMins = max(5.0, l1Min + l2Min + pickupDwellMins)
                  }

                  val orderId = "${platform.take(2).uppercase(Locale.US)}-${(nowMs / 1000L) % 100000}"
                  val newPickup = Waypoint("$orderId-P", orderId, platform, "PICKUP", pickupLabel, pLat, pLng, nowMs + (pickupDueMins * 60_000.0).toLong(), pickupDwellMins, payout = 0.0, orderName = pickupName, hasRealCoords = isKnownZone(pickupLabel))
                  val newDropoff = Waypoint("$orderId-D", orderId, platform, "DROPOFF", dropoffLabel, dLat, dLng, nowMs + (dropoffDueMins * 60_000.0).toLong(), dropoffDwellMins, payout, orderName = dropoffName, hasRealCoords = isKnownZone(dropoffLabel))

                  // v2.3: Flex / return corridor gate and Finish-close-to-home
                  // gate run BEFORE floor grading, on the anchor path too.
                  flexCorridorGate(newDropoff.lat, newDropoff.lng, estMins, orderId, payout, platform, nowMs)?.let { return it }
                  finishCloseGate(newDropoff.lat, newDropoff.lng, orderId, payout, platform)?.let { return it }

                  if (activeWaypoints.isEmpty()) {
                      val effMiles = if (deadheadMode) estMiles * 2.0 else estMiles
                      val returnMins = (estMiles / deadheadReturnMph) * 60.0
                      val effMins = if (deadheadMode) estMins + returnMins else estMins
                      val perMile = payout / max(0.1, effMiles)
                      val perHour = payout / max(0.05, effMins / 60.0)
                      val effAnchorMile = effectiveAnchorMinPerMile()
                      val effAnchorHour = effectiveAnchorMinPerHour()
                      val passes = perMile >= effAnchorMile && perHour >= effAnchorHour
                      val candidateSeq = listOf(newPickup, newDropoff)
                      if (passes) {
                          pendingCandidateOrderId = orderId
                          pendingCandidateStops = candidateSeq
                      }
                      // INTENTIONAL, Nov 13 (driver's call): the first order
                      // of a route is NEVER auto-accepted — verdict-only STACK
                      // with the green "I ACCEPTED IT" button for 12s. Only
                      // add-ons to a live route may auto-accept. Do not
                      // change this to passes && autoAcceptEnabled.
                      val autoAccept = false
                      val reason = if (passes) {
                          if (isGuardActive()) String.format(Locale.US, "$%.2f/mi • $%.0f/hr (Anchor • RATE GUARD floors $%.2f/mi • $%.0f/hr)", perMile, perHour, effAnchorMile, effAnchorHour)
                          else String.format(Locale.US, "$%.2f/mi • $%.0f/hr (Anchor)", perMile, perHour)
                      } else String.format(Locale.US, "Below floor ($%.2f/mi • $%.0f/hr)", perMile, perHour)
                      // v2.3.3 (fix 6): announce the drop-off area — the
                      // area name is all DoorDash/Uber show before accept;
                      // the exact street address is never read or spoken.
                      val tts = if (passes) {
                          if (isGuardActive()) String.format(Locale.US, "Stack anchor. Rate guard on. %.2f dollars, %.2f per mile. Drop-off %s.", payout, perMile, dropoffLabel)
                          else String.format(Locale.US, "Stack anchor. %.2f dollars, %.2f per mile. Drop-off %s.", payout, perMile, dropoffLabel)
                      } else String.format(Locale.US, "Skip. %.2f per mile. Drop-off %s.", perMile, dropoffLabel)

                      return EvaluationResult(
                          verdict = if (passes) "STACK" else "SKIP",
                          mode = "ANCHOR",
                          autoAccept = autoAccept,
                          orderId = orderId,
                          payout = payout,
                          metricPerMile = perMile,
                          metricPerHour = perHour,
                          slaBufferMins = dropoffDueMins - estMins,
                          reason = reason,
                          ttsSpeech = tts,
                          dropoffArea = dropoffLabel,
                          wazeNavUrl = navUrlForStop(newPickup),
                          optimizedStops = candidateSeq.map { "${it.stopType}: ${it.label}" },
                          platform = platform,
                          guardActive = isGuardActive(),
                          guardBadge = guardBadgeText(),
                          appBadge = appBadge(platform),
                          isCrossApp = isCrossAppCandidate(platform),
                      flexBadge = flexBadgeText(),
                      )
                  }

                  val baseline = simulateSequence(activeWaypoints, nowMs)

                  // FEATURE 2: one route holds at most THREE apps at once. A
                  // fourth app cannot join until an app's stops are complete.
                  if (routeHasThreeApps() && normalizedPlatform(platform) !in routePlatforms()) {
                      return EvaluationResult(
                          verdict = "SKIP",
                          mode = "THREE_APP_LIMIT",
                          autoAccept = false,
                          orderId = orderId,
                          payout = payout,
                          metricPerMile = 0.0,
                          metricPerHour = 0.0,
                          slaBufferMins = 0.0,
                          reason = "Route already has 3 apps (${routePlatforms().joinToString(" + ")}): ${normalizedPlatform(platform)} cannot join this route",
                          ttsSpeech = "Skip. Route already has three apps. Drop-off $dropoffLabel.",
                          dropoffArea = dropoffLabel,
                          wazeNavUrl = "",
                          optimizedStops = activeWaypoints.map { "${it.stopType}: ${it.label}" },
                          platform = platform,
                          guardActive = isGuardActive(),
                          guardBadge = guardBadgeText(),
                          appBadge = appBadge(platform),
                          isCrossApp = true,
                      flexBadge = flexBadgeText(),
                      )
                  }

                  // v2.3.1 PERF: hard cap of 3 active orders. The old
                  // optimizer enumerated every permutation of all stops,
                  // so a 4th order (8 stops) meant 40,320 sequences.
                  // With the lazy pruned generator below, 3 orders is
                  // still the safe bound for on-phone evaluation.
                  if (activeOrderCount() >= 3) {
                      return EvaluationResult(
                          verdict = "SKIP",
                          mode = "ORDER_LIMIT",
                          autoAccept = false,
                          orderId = orderId,
                          payout = payout,
                          metricPerMile = 0.0,
                          metricPerHour = 0.0,
                          slaBufferMins = 0.0,
                          reason = "Route already has 3 active orders — finish or drop one before stacking more",
                          ttsSpeech = "Skip. Route already has three orders. Drop-off $dropoffLabel.",
                          dropoffArea = dropoffLabel,
                          wazeNavUrl = "",
                          optimizedStops = activeWaypoints.map { "${it.stopType}: ${it.label}" },
                          platform = platform,
                          guardActive = isGuardActive(),
                          guardBadge = guardBadgeText(),
                          appBadge = appBadge(platform),
                          isCrossApp = isCrossAppCandidate(platform),
                      flexBadge = flexBadgeText(),
                      )
                  }

                  val allStops = activeWaypoints + listOf(newPickup, newDropoff)
                  var bestEval: SimStats? = null
                  var bestSeq: List<Waypoint>? = null

                  for (seq in validSequences(allStops)) {
                      val sim = simulateSequence(seq, nowMs)
                      if (!sim.slaSafe) continue
                      if (bestEval == null || sim.totalMins < bestEval.totalMins) {
                          bestEval = sim
                          bestSeq = seq
                      }
                  }

                  if (bestEval == null || bestSeq == null) {
                      return EvaluationResult(
                          verdict = "SKIP",
                          mode = "SLA_BLOCK",
                          autoAccept = false,
                          orderId = orderId,
                          payout = payout,
                          metricPerMile = 0.0,
                          metricPerHour = 0.0,
                          slaBufferMins = 0.0,
                          reason = "SLA Guardrail: Detour risks late stop",
                          ttsSpeech = "Skip. Off corridor or risks late delivery. Drop-off $dropoffLabel.",
                          dropoffArea = dropoffLabel,
                          wazeNavUrl = "",
                          optimizedStops = activeWaypoints.map { "${it.stopType}: ${it.label}" },
                          platform = platform,
                          guardActive = isGuardActive(),
                          guardBadge = guardBadgeText(),
                          appBadge = appBadge(platform),
                          isCrossApp = isCrossAppCandidate(platform),
                      flexBadge = flexBadgeText(),
                      )
                  }

                  // v2.3: Flex / return corridor gate, then Finish-close-to-home
                  // (the route's last stop after adding must end near home).
                  flexCorridorGate(newDropoff.lat, newDropoff.lng, bestEval.totalMins, orderId, payout, platform, nowMs)?.let { return it }
                  val routeEndAfterAdd = bestSeq.last()
                  finishCloseGate(routeEndAfterAdd.lat, routeEndAfterAdd.lng, orderId, payout, platform)?.let { return it }

                  var marginalMiles = max(0.15, bestEval.totalMiles - baseline.totalMiles)
                  // v2.2: calibrate the estimate with real driven miles — the
                  // roads here run longer than the straight-line estimate by
                  // this ratio, clamped so one bad fix cannot skew grading.
                  val startLat = routeStartLat
                  val startLng = routeStartLng
                  if (routeMiles > 0.5 && startLat != null && startLng != null) {
                      val estDriven = haversineMiles(startLat, startLng, driverLat, driverLng) * roadTortuosity
                      if (estDriven > 0.5) marginalMiles *= (routeMiles / estDriven).coerceIn(0.8, 1.25)
                  }
                  val marginalMins = max(1.5, bestEval.totalMins - baseline.totalMins)
                  if (marginalMins > maxDetourMins || marginalMiles > maxDetourMiles) {
                      return EvaluationResult(
                          verdict = "SKIP",
                          mode = "OFF_CORRIDOR",
                          autoAccept = false,
                          orderId = orderId,
                          payout = payout,
                          metricPerMile = 0.0,
                          metricPerHour = 0.0,
                          slaBufferMins = bestEval.minSlackMins,
                          reason = String.format(Locale.US, "Off corridor: +%.1f mi / %.0f min detour", marginalMiles, marginalMins),
                          ttsSpeech = "Skip. Too far out of the way. Drop-off $dropoffLabel.",
                          dropoffArea = dropoffLabel,
                          wazeNavUrl = "",
                          optimizedStops = activeWaypoints.map { "${it.stopType}: ${it.label}" },
                          platform = platform,
                          guardActive = isGuardActive(),
                          guardBadge = guardBadgeText(),
                          appBadge = appBadge(platform),
                          isCrossApp = isCrossAppCandidate(platform),
                      flexBadge = flexBadgeText(),
                      )
                  }
                  val nearestStopMiles = activeWaypoints.minOfOrNull { haversineMiles(newDropoff.lat, newDropoff.lng, it.lat, it.lng) } ?: 0.0
                  if (nearestStopMiles > maxAreaGapMiles) {
                      return EvaluationResult(
                          verdict = "SKIP",
                          mode = "OFF_AREA",
                          autoAccept = false,
                          orderId = orderId,
                          payout = payout,
                          metricPerMile = 0.0,
                          metricPerHour = 0.0,
                          slaBufferMins = bestEval.minSlackMins,
                          reason = String.format(Locale.US, "Too far from route: %.1f mi from nearest stop", nearestStopMiles),
                          ttsSpeech = "Skip. Too far from your area. Drop-off $dropoffLabel.",
                          dropoffArea = dropoffLabel,
                          wazeNavUrl = "",
                          optimizedStops = activeWaypoints.map { "${it.stopType}: ${it.label}" },
                          platform = platform,
                          guardActive = isGuardActive(),
                          guardBadge = guardBadgeText(),
                          appBadge = appBadge(platform),
                          isCrossApp = isCrossAppCandidate(platform),
                      flexBadge = flexBadgeText(),
                      )
                  }
                  val margPerMile = payout / marginalMiles
                  val margPerHour = payout / (marginalMins / 60.0)
                  val passesStack = margPerMile >= marginalMinPerMile && margPerHour >= marginalMinPerHour
                  val autoAccept = passesStack && autoAcceptEnabled
                  val nextStop = bestSeq.first()

                  if (passesStack) {
                      pendingCandidateOrderId = orderId
                      pendingCandidateStops = bestSeq
                  }

                  val crossApp = isCrossAppCandidate(platform)
                  val crossLabel = if (crossApp) "Cross-app ${anchorPlatform() ?: ""}->${normalizedPlatform(platform)}: " else ""
                  val reason = if (passesStack) String.format(Locale.US, "%s+%.1f mi • $%.2f/marg mi • %.0fm cushion", crossLabel, marginalMiles, margPerMile, bestEval.minSlackMins)
                  else String.format(Locale.US, "%s+%.1f detour mi ($%.2f/marg mi)", crossLabel, marginalMiles, margPerMile)
                  // v2.3.3 (fix 6): announce the drop-off area on add-ons too.
                  val tts = if (passesStack) String.format(Locale.US, "Stack add-on%s, %.2f dollars. Adds %.1f miles. Drop-off %s.", if (crossApp) " from ${spokenPlatform(platform)}" else "", payout, marginalMiles, dropoffLabel)
                  else String.format(Locale.US, "Skip. Adds %.1f detour miles. Drop-off %s.", marginalMiles, dropoffLabel)

                  return EvaluationResult(
                      verdict = if (passesStack) "STACK" else "SKIP",
                      mode = "ON-CORRIDOR",
                      autoAccept = autoAccept,
                      orderId = orderId,
                      payout = payout,
                      metricPerMile = margPerMile,
                      metricPerHour = margPerHour,
                      slaBufferMins = bestEval.minSlackMins,
                      reason = reason,
                      ttsSpeech = tts,
                      dropoffArea = dropoffLabel,
                      wazeNavUrl = navUrlForStop(nextStop),
                      optimizedStops = bestSeq.map { "${it.stopType}: ${it.label}" },
                      platform = platform,
                      guardActive = isGuardActive(),
                      guardBadge = guardBadgeText(),
                      appBadge = appBadge(platform),
                      isCrossApp = isCrossAppCandidate(platform),
                      flexBadge = flexBadgeText(),
                  )
              }

              fun commitPendingCandidate(orderId: String? = null): Boolean {
                  val stops = pendingCandidateStops ?: return false
                  if (orderId != null && pendingCandidateOrderId != orderId) return false
                  val committedOrderId = pendingCandidateOrderId
                  val wasEmpty = activeWaypoints.isEmpty()
                  activeWaypoints.clear()
                  activeWaypoints.addAll(stops)
                  isRouteActive = true
                  pendingCandidateStops = null
                  pendingCandidateOrderId = null
                  if (wasEmpty) {
                      // Route starts here: mileage tracker zeroes and starts.
                      // v2.3.3 (fix 3): a new route also clears the BACK
                      // history — stops from the old route cannot be undone
                      // into the new one.
                      completedStopHistory.clear()
                      lastCompletedRouteMiles = 0.0
                      lastCompletedRoutePay = 0.0
                      lastCompletedWasRouteEnd = false
                      routeMiles = 0.0
                      completedRoutePay = 0.0
                      announcedArrivals.clear()
                      lastMileageLat = null
                      lastMileageLng = null
                      routeStartLat = driverLat
                      routeStartLng = driverLng
                      onRouteActiveChanged?.invoke(true)
                  } else {
                      // Stop added to a live route — one-line voice update
                      // with the new route totals (miles + minutes).
                      val sim = simulateSequence(activeWaypoints, System.currentTimeMillis())
                      val added = stops.firstOrNull { it.orderId == committedOrderId && it.stopType == "DROPOFF" }
                      if (added != null) {
                          fireRouteEvent("added:${added.stopId}", String.format(Locale.US, "Added %s %s, %s. Route now %.1f miles, %.0f minutes.", spokenPlatform(added.platform), added.stopType.lowercase(Locale.US), added.label, sim.totalMiles, sim.totalMins))
                      }
                      if (sim.minSlackMins < 10.0) {
                          fireRouteEvent("sla:${sim.minSlackMins.toInt()}", String.format(Locale.US, "Warning, %d minutes slack on the next dropoff.", sim.minSlackMins.toInt()))
                      }
                  }
                  checkGuardTransition()
                  return true
              }

              fun clearPendingCandidate() {
                  pendingCandidateStops = null
                  pendingCandidateOrderId = null
              }

              fun completeNextStop(): String {
                  if (activeWaypoints.isEmpty()) return "No active stops."
                  val apps = routePlatforms().joinToString("+").ifEmpty { "—" }
                  val done = activeWaypoints.removeAt(0)
                  // v2.3.3 (fix 3): remember the completed stop so BACK can
                  // put it back. History is capped at 20 stops.
                  completedStopHistory.addLast(done)
                  if (completedStopHistory.size > 20) completedStopHistory.removeFirst()
                  announcedArrivals.remove(done.stopId)
                  if (done.stopType == "DROPOFF") completedRoutePay += done.payout
                  if (activeWaypoints.isEmpty()) {
                      // v2.3: a live Flex block or return leg means the
                      // route is NOT over — mileage keeps running and the
                      // trip is logged when the block / return actually ends.
                      if (flexBlock != null || isReturnMode) {
                          val tail = if (flexBlock != null) "Flex block still active." else "Return trip still going."
                          lastCompletedWasRouteEnd = false
                          onStopsChanged?.invoke()
                          return "Completed ${done.stopType}: ${done.label}. $tail"
                      }
                      isRouteActive = false
                      dayPay += completedRoutePay
                      val today = java.text.SimpleDateFormat("yyyy-MM-dd", Locale.US).format(java.util.Date())
                      tripLog.add(TripEntry(today, apps, routeMiles, completedRoutePay))
                      if (tripLog.size > 30) tripLog.removeAt(0)
                      appContext?.let { saveTripLog(it) }
                      // v2.3.3 (fix 3): snapshot the totals BEFORE clearing
                      // the pay accumulator so BACK can un-log this trip.
                      // routeMiles is NOT zeroed here any more — the trip's
                      // miles stay on screen until the NEXT route starts
                      // (commitPendingCandidate zeroes them then), so an
                      // accidental advance never blanks the mileage screen.
                      lastCompletedRouteMiles = routeMiles
                      lastCompletedRoutePay = completedRoutePay
                      lastCompletedWasRouteEnd = true
                      completedRoutePay = 0.0
                      routeStartLat = null
                      routeStartLng = null
                      onRouteActiveChanged?.invoke(false)
                      onMileageChanged?.invoke()
                      onStopsChanged?.invoke()
                      return "Completed ${done.stopType}: ${done.label}. Route complete."
                  }
                  lastCompletedWasRouteEnd = false
                  onStopsChanged?.invoke()
                  return "Completed ${done.stopType}: ${done.label}. Next -> ${activeWaypoints.first().label}"
              }

              // v2.3.3 (fix 3): BACK — undo the last stop advance, whether
              // it came from a pill tap, the completion screen, or the
              // arrival auto-advance (fix 4). If the undone stop had ended
              // the route, the trip it just logged is un-logged and the
              // route totals are restored, so the mileage screen never
              // shows zero after an accidental advance.
              fun undoLastStop(): String {
                  val last = completedStopHistory.removeLastOrNull() ?: return "Nothing to go back to."
                  if (lastCompletedWasRouteEnd) {
                      val today = java.text.SimpleDateFormat("yyyy-MM-dd", Locale.US).format(java.util.Date())
                      val lastEntry = tripLog.lastOrNull()
                      if (lastEntry != null && lastEntry.date == today && lastEntry.miles == lastCompletedRouteMiles && lastEntry.pay == lastCompletedRoutePay) {
                          tripLog.removeAt(tripLog.size - 1)
                          appContext?.let { saveTripLog(it) }
                      }
                      dayPay = max(0.0, dayPay - lastCompletedRoutePay)
                      routeMiles = lastCompletedRouteMiles
                      completedRoutePay = lastCompletedRoutePay
                      lastCompletedRouteMiles = 0.0
                      lastCompletedRoutePay = 0.0
                      lastCompletedWasRouteEnd = false
                  } else if (last.stopType == "DROPOFF") {
                      completedRoutePay = max(0.0, completedRoutePay - last.payout)
                  }
                  activeWaypoints.add(0, last)
                  // Keep the undone stop from instantly re-announcing and
                  // re-auto-advancing while the driver is still standing
                  // at it — the driver advances it again by hand (or BACK
                  // again) when they actually leave.
                  announcedArrivals.add(last.stopId)
                  isRouteActive = true
                  onRouteActiveChanged?.invoke(true)
                  onMileageChanged?.invoke()
                  onStopsChanged?.invoke()
                  return "Back to ${last.stopType}: ${last.label}"
              }

              fun resetRoute() {
                  activeWaypoints.clear()
                  // v2.3.3 (fix 3): a manual route reset also clears the
                  // BACK history — there is nothing to go back to.
                  completedStopHistory.clear()
                  lastCompletedRouteMiles = 0.0
                  lastCompletedRoutePay = 0.0
                  lastCompletedWasRouteEnd = false
                  // v2.3: a Flex block / return leg survives a route reset —
                  // mileage keeps running until the block or return ends.
                  isRouteActive = flexBlock != null || isReturnMode
                  pendingCandidateStops = null
                  pendingCandidateOrderId = null
                  routeMiles = 0.0
                  completedRoutePay = 0.0
                  routeStartLat = null
                  routeStartLng = null
                  announcedArrivals.clear()
                  onRouteActiveChanged?.invoke(false)
              }
          }
          '''

          files["app/src/main/java/com/builttoearn/stackr/StackrOverlayManager.kt"] = r'''package com.builttoearn.stackr

          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.animation.TranslateAnimation
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Locale
          import kotlin.math.abs

          @SuppressLint("StaticFieldLeak")
          object StackrOverlayManager {
              var isOverlayEnabled = true
              var autoAcceptCountdownSecs = 5

              private var windowManager: WindowManager? = null
              private var rootView: View? = null
              private var layoutParams: WindowManager.LayoutParams? = null
              private val mainHandler = Handler(Looper.getMainLooper())
              private var activeFlashRunnable: Runnable? = null

              var onUserInteractionCallback: ((String) -> Unit)? = null

              fun show(context: Context) {
                  if (!isOverlayEnabled || !Settings.canDrawOverlays(context)) return
                  mainHandler.post {
                      if (rootView != null) {
                          refreshPill()
                          return@post
                      }
                      try {
                          val appCtx = context.applicationContext
                          val wm = appCtx.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                          val view = LayoutInflater.from(appCtx).inflate(R.layout.overlay_hud, null)
                          val overlayType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE

                          val params = WindowManager.LayoutParams(
                              WindowManager.LayoutParams.WRAP_CONTENT,
                              WindowManager.LayoutParams.WRAP_CONTENT,
                              overlayType,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                              PixelFormat.TRANSLUCENT
                          ).apply {
                              // v2.3.3 (fix 7): slim top banner — centred at
                              // the very top so it never covers the middle of
                              // the screen where the navigation map (and the
                              // host app's own alerts) live. The pill stays
                              // draggable from here.
                              gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                              x = 0
                              y = 32
                          }

                          setupTouchAndDrag(appCtx, view, wm, params)
                          wm.addView(view, params)
                          windowManager = wm
                          rootView = view
                          layoutParams = params
                          refreshPill()
                      } catch (_: Exception) {}
                  }
              }

              fun hide() {
                  mainHandler.post {
                      activeFlashRunnable?.let { mainHandler.removeCallbacks(it) }
                      activeFlashRunnable = null
                      try {
                          if (rootView != null && windowManager != null) windowManager?.removeView(rootView)
                      } catch (_: Exception) {} finally {
                          rootView = null
                          windowManager = null
                          layoutParams = null
                      }
                  }
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupTouchAndDrag(appCtx: Context, view: View, wm: WindowManager, params: WindowManager.LayoutParams) {
                  val pillContainer = view.findViewById<LinearLayout>(R.id.pillContainer)
                  var initialX = 0
                  var initialY = 0
                  var initialTouchX = 0f
                  var initialTouchY = 0f
                  var touchDownTime = 0L

                  pillContainer.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              touchDownTime = System.currentTimeMillis()
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = initialX + (event.rawX - initialTouchX).toInt()
                              params.y = initialY + (event.rawY - initialTouchY).toInt()
                              try { wm.updateViewLayout(view, params) } catch (_: Exception) {}
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              val dx = abs(event.rawX - initialTouchX)
                              val dy = abs(event.rawY - initialTouchY)
                              val elapsed = System.currentTimeMillis() - touchDownTime
                              if (dx < 14f && dy < 14f) {
                                  if (RouteStackEngine.isPaused) {
                                      RouteStackEngine.setPaused(false, appCtx)
                                      refreshPill()
                                      onUserInteractionCallback?.invoke("STACKR live — grading offers")
                                  } else if (elapsed >= 450L) {
                                      RouteStackEngine.autoAcceptEnabled = !RouteStackEngine.autoAcceptEnabled
                                      refreshPill()
                                      onUserInteractionCallback?.invoke(if (RouteStackEngine.autoAcceptEnabled) "Auto-Accept enabled" else "Co-Pilot mode")
                                  } else if (RouteStackEngine.activeWaypoints.isNotEmpty()) {
                                      val msg = RouteStackEngine.completeNextStop()
                                      refreshPill()
                                      onUserInteractionCallback?.invoke(msg)
                                      val nxt = RouteStackEngine.activeWaypoints.firstOrNull()
                                      if (nxt != null && RouteStackEngine.autoLaunchWaze) {
                                          launchWaze(appCtx, RouteStackEngine.navUrlForNext())
                                      }
                                  }
                              }
                              true
                          }
                          else -> false
                      }
                  }
              }

              fun refreshPill() {
                  mainHandler.post {
                      val view = rootView ?: return@post
                      val dot = view.findViewById<TextView>(R.id.overlayDot)
                      val title = view.findViewById<TextView>(R.id.overlayPillTitle)
                      val sub = view.findViewById<TextView>(R.id.overlayPillSub)

                      if (RouteStackEngine.isPaused) {
                          dot.setTextColor(0xFFFFCC4D.toInt())
                          title.text = "STACKR • PAUSED"
                          sub.text = "Tap pill to resume"
                          return@post
                      }

                      if (RouteStackEngine.activeWaypoints.isNotEmpty()) {
                          val nextStop = RouteStackEngine.activeWaypoints.first()
                          dot.setTextColor(0xFF19C37D.toInt())
                          title.text = String.format(Locale.US, "$%.2f • %d ORD", RouteStackEngine.totalLockedPayout(), RouteStackEngine.activeOrderCount())
                          sub.text = "Next: ${nextStop.label}"
                      } else {
                          val autoOn = RouteStackEngine.autoAcceptEnabled
                          dot.setTextColor(if (autoOn) 0xFF19C37D.toInt() else 0xFFFFCC4D.toInt())
                          title.text = if (autoOn) "STACKR • AUTO" else "STACKR • PILOT"
                          sub.text = if (RouteStackEngine.isGuardActive()) String.format(Locale.US, "RATE GUARD $%.2f/m • $%.0f/h", RouteStackEngine.effectiveAnchorMinPerMile(), RouteStackEngine.effectiveAnchorMinPerHour()) else String.format(Locale.US, "$%.2f/m • $%.0f/h", RouteStackEngine.anchorMinPerMile, RouteStackEngine.anchorMinPerHour)
                      }
                  }
              }

              fun showVerdictFlash(context: Context, result: EvaluationResult, onConfirmAutoAccept: (() -> Unit)? = null, onManualConfirm: (() -> Unit)? = null, onCancelAutoAccept: (() -> Unit)? = null, onManualTimeout: (() -> Unit)? = null) {
                  if (!isOverlayEnabled || !Settings.canDrawOverlays(context)) return
                  if (rootView == null) show(context)

                  mainHandler.post {
                      val view = rootView ?: return@post
                      activeFlashRunnable?.let { mainHandler.removeCallbacks(it) }

                      val pillContainer = view.findViewById<LinearLayout>(R.id.pillContainer)
                      val flashContainer = view.findViewById<LinearLayout>(R.id.flashContainer)
                      val flashTitle = view.findViewById<TextView>(R.id.flashTitle)
                      val flashBadge = view.findViewById<TextView>(R.id.flashBadge)
                      val flashReason = view.findViewById<TextView>(R.id.flashReason)
                      val flashNextStop = view.findViewById<TextView>(R.id.flashNextStop)
                      val flashActionRow = view.findViewById<LinearLayout>(R.id.flashActionRow)
                      val flashCountdown = view.findViewById<TextView>(R.id.flashCountdown)
                      val btnCancel = view.findViewById<TextView>(R.id.btnFlashCancel)
                      val flashConfirmRow = view.findViewById<LinearLayout>(R.id.flashConfirmRow)
                      val btnFlashConfirm = view.findViewById<TextView>(R.id.btnFlashConfirm)

                      val isStack = result.verdict == "STACK"
                      flashContainer.setBackgroundResource(if (isStack) R.drawable.bg_flash_stack else R.drawable.bg_flash_skip)
                      flashTitle.setTextColor(if (isStack) 0xFF19C37D.toInt() else 0xFFFF4D4F.toInt())
                      flashTitle.text = String.format(Locale.US, "%s • $%.2f", result.verdict, result.payout)
                      flashBadge.text = result.mode + (if (result.flexBadge.isNotEmpty()) " • " + result.flexBadge else "") + (if (result.appBadge.isNotEmpty()) " • " + result.appBadge else "")
                      val guardBadgeView = view.findViewById<TextView>(R.id.flashGuardBadge)
                      if (result.guardActive) {
                          guardBadgeView.visibility = View.VISIBLE
                          guardBadgeView.text = "RATE GUARD — floors loosened to rebuild accept rate"
                      } else {
                          guardBadgeView.visibility = View.GONE
                      }
                      flashReason.text = result.reason
                      // v2.3.3 (fix 6): show the drop-off area on the alert.
                      val nextStopLine = result.optimizedStops.firstOrNull()?.let { "Next: $it" } ?: ""
                      val dropoffLine = if (result.dropoffArea.isNotBlank()) "Drop-off ${result.dropoffArea}" else ""
                      flashNextStop.text = if (dropoffLine.isNotEmpty() && nextStopLine.isNotEmpty()) "$nextStopLine • $dropoffLine" else nextStopLine + dropoffLine
                      val btnNavigate = view.findViewById<TextView>(R.id.btnFlashNavigate)
                      btnNavigate.text = "NAVIGATE WITH " + RouteStackEngine.navApp.uppercase(Locale.US) + " →"
                      btnNavigate.setOnClickListener {
                          val url = RouteStackEngine.navUrlForNext().ifEmpty { result.wazeNavUrl }
                          if (url.isNotEmpty()) launchWaze(context, url)
                      }

                      // v2.3.3 (fix 1 + fix 7): the red decline popup was way
                      // too big and its near-black blanket covered the map.
                      // SKIP now renders as a compact slim banner (210dp,
                      // small text, no nav button, drop-off in the reason
                      // line). The green STACK alert below restores full
                      // size every time, so it never inherits the small
                      // decline styling (fix 2 — green alert untouched).
                      val density = context.resources.displayMetrics.density
                      if (!isStack) {
                          val compactParams = flashContainer.layoutParams
                          compactParams.width = (210 * density).toInt()
                          flashContainer.layoutParams = compactParams
                          flashContainer.setPadding((8 * density).toInt(), (8 * density).toInt(), (8 * density).toInt(), (8 * density).toInt())
                          flashTitle.textSize = 13f
                          flashReason.textSize = 11f
                          flashReason.maxLines = 2
                          flashReason.ellipsize = android.text.TextUtils.TruncateAt.END
                          flashReason.text = if (dropoffLine.isNotEmpty()) "${result.reason} • $dropoffLine" else result.reason
                          flashNextStop.visibility = View.GONE
                          btnNavigate.visibility = View.GONE
                      } else {
                          val fullParams = flashContainer.layoutParams
                          fullParams.width = (316 * density).toInt()
                          flashContainer.layoutParams = fullParams
                          flashContainer.setPadding((14 * density).toInt(), (14 * density).toInt(), (14 * density).toInt(), (14 * density).toInt())
                          flashTitle.textSize = 17f
                          flashReason.textSize = 12.5f
                          flashReason.maxLines = Int.MAX_VALUE
                          flashNextStop.visibility = View.VISIBLE
                          btnNavigate.visibility = View.VISIBLE
                      }

                      pillContainer.visibility = View.GONE
                      flashContainer.visibility = View.VISIBLE
                      // v2.3.3 (fix 7): the banner slides up into place
                      // instead of popping over the map.
                      flashContainer.startAnimation(TranslateAnimation(0f, 0f, 120f, 0f).apply { duration = 250L })

                      if (isStack && result.autoAccept && onConfirmAutoAccept != null) {
                          flashActionRow.visibility = View.VISIBLE
                          flashConfirmRow.visibility = View.GONE
                          var cancelled = false
                          var secondsLeft = autoAcceptCountdownSecs

                          btnCancel.setOnClickListener {
                              cancelled = true
                              onCancelAutoAccept?.invoke()
                              activeFlashRunnable?.let { mainHandler.removeCallbacks(it) }
                              RouteStackEngine.clearPendingCandidate()
                              flashCountdown.setTextColor(0xFFFF4D4F.toInt())
                              flashCountdown.text = "✕ CANCELLED BY DRIVER"
                              scheduleCollapse(1400L)
                          }

                          val tickRunnable = object : Runnable {
                              override fun run() {
                                  if (cancelled) return
                                  if (secondsLeft > 0) {
                                      flashCountdown.setTextColor(0xFF19C37D.toInt())
                                      flashCountdown.text = "Auto-accepting in ${secondsLeft}s..."
                                      secondsLeft--
                                      mainHandler.postDelayed(this, 1000L)
                                  } else {
                                      onConfirmAutoAccept.invoke()
                                      flashCountdown.setTextColor(0xFF19C37D.toInt())
                                      flashCountdown.text = "✓ ACCEPTED & ROUTED"
                                      scheduleCollapse(1400L)
                                  }
                              }
                          }
                          activeFlashRunnable = tickRunnable
                          mainHandler.post(tickRunnable)
                      } else if (isStack && onManualConfirm != null) {
                          flashActionRow.visibility = View.GONE
                          flashConfirmRow.visibility = View.VISIBLE
                          var manualConfirmed = false
                          btnFlashConfirm.setOnClickListener {
                              manualConfirmed = true
                              activeFlashRunnable?.let { mainHandler.removeCallbacks(it) }
                              onManualConfirm.invoke()
                              flashReason.text = "\u2713 Route started"
                              flashConfirmRow.visibility = View.GONE
                              scheduleCollapse(1400L)
                          }
                          // Let-expire on a manual anchor counts as a decline too.
                          mainHandler.postDelayed({
                              if (!manualConfirmed) onManualTimeout?.invoke()
                          }, 12000L)
                          scheduleCollapse(12000L)
                      } else {
                          flashActionRow.visibility = View.GONE
                          flashConfirmRow.visibility = View.GONE
                          scheduleCollapse(4200L)
                      }
                  }
              }

              // v2.3.3 (fix 7): the banner slides down out of the way
              // instead of vanishing in place, then the pill comes back.
              private fun scheduleCollapse(delayMs: Long) {
                  val collapseRunnable = Runnable {
                      val view = rootView ?: return@Runnable
                      val flash = view.findViewById<LinearLayout>(R.id.flashContainer)
                      flash.startAnimation(TranslateAnimation(0f, 0f, 0f, 120f).apply { duration = 220L })
                      mainHandler.postDelayed({
                          flash.visibility = View.GONE
                          view.findViewById<LinearLayout>(R.id.flashConfirmRow).visibility = View.GONE
                          view.findViewById<LinearLayout>(R.id.pillContainer).visibility = View.VISIBLE
                          refreshPill()
                      }, 240L)
                  }
                  activeFlashRunnable = collapseRunnable
                  mainHandler.postDelayed(collapseRunnable, delayMs)
              }

              private fun launchWaze(context: Context, url: String) {
                  try {
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                      context.startActivity(intent)
                  } catch (_: Exception) {}
              }
          }
          '''

          files["app/src/main/java/com/builttoearn/stackr/StackrAccessibilityService.kt"] = r'''package com.builttoearn.stackr

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.net.Uri
          import android.speech.tts.TextToSpeech
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.util.Locale

          class StackrAccessibilityService : AccessibilityService(), TextToSpeech.OnInitListener {
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var lastEvaluatedHash = 0
              private var lastEvaluatedTimeMs = 0L
              private var lastTraverseTimeMs = 0L
              private var lastSpokenKey = ""
              private var lastSpokenTimeMs = 0L
              private var lastDeclineKey = ""
              private var lastCompletionTimeMs = 0L

              companion object {
                  var isRunning = false
                  var onStateUpdated: (() -> Unit)? = null
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  isRunning = true
                  RouteStackEngine.loadAcceptanceCounts(this)
                  RouteStackEngine.onAcceptanceCountsChanged = { RouteStackEngine.saveAcceptanceCounts(this) }
                  RouteStackEngine.setAppContext(this)
                  RouteStackEngine.loadTripLog(this)
                  RouteStackEngine.loadFlexPrefs(this)
                  RouteStackEngine.onRouteEvent = { msg ->
                      speak(msg)
                      StackrEvents.postLog(msg)
                      onStateUpdated?.invoke()
                  }
                  RouteStackEngine.onRouteActiveChanged = { active ->
                      if (active) MileageService.start(this) else MileageService.stop(this)
                  }
                  RouteStackEngine.onMileageChanged = { onStateUpdated?.invoke() }
                  // v2.3.3 (fix 4): after any stop advance (manual, arrival
                  // auto-advance, or BACK undo) re-render the floating pill
                  // so it shows the new next stop.
                  RouteStackEngine.onStopsChanged = { StackrOverlayManager.refreshPill() }
                  tts = TextToSpeech(this, this)
                  StackrEvents.postLog("Agent Active • Listening behind Waze")
                  StackrOverlayManager.onUserInteractionCallback = { msg ->
                      StackrEvents.postLog(msg)
                      speak(msg)
                      onStateUpdated?.invoke()
                  }
                  StackrOverlayManager.show(this)
                  onStateUpdated?.invoke()
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale.US
                      ttsReady = true
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val pkg = event?.packageName?.toString() ?: return
                  // v2.3.1 PERF: the OS config already limits this service
                  // to the three driver apps — check again here so a stray
                  // event can never trigger a tree walk.
                  if (pkg != "com.doordash.driverapp" && pkg != "com.grubhub.driver" && pkg != "com.ubercab.driver") return
                  // v2.3.1 PERF: throttle the tree walk to once per 500ms.
                  // typeWindowContentChanged fires dozens of times a second
                  // (map pans, timers, animations) and every event used to
                  // walk the whole UI tree. Offer screens sit for seconds,
                  // so 500ms loses nothing.
                  val now = System.currentTimeMillis()
                  if (now - lastTraverseTimeMs < 500L) return
                  lastTraverseTimeMs = now
                  val root = rootInActiveWindow ?: return
                  val collectedText = StringBuilder()
                  var hasAcceptButton = false
                  var isStopCompletionScreen = false

                  fun traverse(node: AccessibilityNodeInfo?) {
                      if (node == null) return
                      val txt = node.text?.toString()?.trim()
                        if (!txt.isNullOrEmpty()) {
                          collectedText.append(txt).append(" ")
                          val lower = txt.lowercase(Locale.US)
                          if (lower == "accept" || lower == "accept order" || lower == "accept delivery") hasAcceptButton = true
                          if (lower.contains("confirm pickup") || lower.contains("complete delivery") || lower.contains("dropoff complete")) isStopCompletionScreen = true
                      }
                      for (i in 0 until node.childCount) traverse(node.getChild(i))
                  }

                  traverse(root)
                  val fullText = collectedText.toString().trim()

                  if (hasAcceptButton && fullText.contains("$") && !RouteStackEngine.isPaused) {
                      val hash = fullText.hashCode()
                      if (hash == lastEvaluatedHash && (now - lastEvaluatedTimeMs) < 12_000L) return
                      lastEvaluatedHash = hash
                      lastEvaluatedTimeMs = now

                      val result = RouteStackEngine.evaluateRawScreenText(fullText, pkg, now) ?: return
                      StackrEvents.postLog("[${result.verdict}] ${result.reason}")
                      val spokenKey = "${result.verdict}|${result.payout}|${result.reason}"
                      if (spokenKey != lastSpokenKey || (now - lastSpokenTimeMs) > 60_000L) {
                          lastSpokenKey = spokenKey
                          lastSpokenTimeMs = now
                          speak(result.ttsSpeech)
                      }

                      // FEATURE 1: a SKIP the driver lets pass counts as a
                      // decline, exactly like tapping decline. Dedupe by offer key.
                      if (result.verdict == "SKIP" && spokenKey != lastDeclineKey) {
                          lastDeclineKey = spokenKey
                          RouteStackEngine.recordDecline(result.platform)
                      }
                      RouteStackEngine.checkGuardTransition()

                      val executeAccept: (() -> Unit)? = if (result.verdict == "STACK" && result.autoAccept) {
                          {
                              val freshAcceptNode = findAcceptNode(rootInActiveWindow)
                              if (clickNodeOrParent(freshAcceptNode)) {
                                  RouteStackEngine.commitPendingCandidate(result.orderId)
                                  RouteStackEngine.recordAccept(result.platform)
                                  RouteStackEngine.checkGuardTransition()
                                  StackrEvents.postLog("[AUTO-ACCEPTED] ${result.reason}")
                                  StackrOverlayManager.refreshPill()
                                  if (RouteStackEngine.autoLaunchWaze && result.wazeNavUrl.isNotEmpty()) launchNav(RouteStackEngine.navUrlForNext())
                              }
                              onStateUpdated?.invoke()
                          }
                      } else null

                      val manualConfirm: (() -> Unit)? = if (result.verdict == "STACK" && !result.autoAccept) {
                          {
                              RouteStackEngine.commitPendingCandidate(result.orderId)
                              RouteStackEngine.recordAccept(result.platform)
                              RouteStackEngine.checkGuardTransition()
                              StackrEvents.postLog("[ROUTE STARTED] ${result.reason}")
                              StackrOverlayManager.refreshPill()
                              if (RouteStackEngine.autoLaunchWaze && result.wazeNavUrl.isNotEmpty()) launchNav(RouteStackEngine.navUrlForNext())
                              onStateUpdated?.invoke()
                          }
                      } else null

                      StackrOverlayManager.showVerdictFlash(this, result, executeAccept, manualConfirm,
                          onCancelAutoAccept = { RouteStackEngine.recordDecline(result.platform) },
                          onManualTimeout = { RouteStackEngine.recordDecline(result.platform) })
                      onStateUpdated?.invoke()
                      return
                  }

                  if (isStopCompletionScreen && RouteStackEngine.activeWaypoints.isNotEmpty() && (now - lastCompletionTimeMs) > 15_000L) {
                      lastCompletionTimeMs = now
                      val msg = RouteStackEngine.completeNextStop()
                      StackrEvents.postLog(msg)
                      speak(msg)
                      StackrOverlayManager.refreshPill()
                      val nextWp = RouteStackEngine.activeWaypoints.firstOrNull()
                      if (nextWp != null && RouteStackEngine.autoLaunchWaze) launchNav(RouteStackEngine.navUrlForNext())
                      onStateUpdated?.invoke()
                  }
              }

              private fun findAcceptNode(root: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (root == null) return null
                  val txt = root.text?.toString()?.trim()?.lowercase(Locale.US)
                  if (txt == "accept" || txt == "accept order" || txt == "accept delivery") return root
                  for (i in 0 until root.childCount) {
                      val found = findAcceptNode(root.getChild(i))
                      if (found != null) return found
                  }
                  return null
              }

              private fun clickNodeOrParent(node: AccessibilityNodeInfo?): Boolean {
                  var cur = node
                  var depth = 0
                  while (cur != null && depth < 5) {
                      if (cur.isClickable) return cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      cur = cur.parent
                      depth++
                  }
                  return false
              }

              private fun launchNav(url: String) {
                  if (url.isEmpty()) return
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                  } catch (_: Exception) {}
              }

              fun speak(message: String) {
                  if (ttsReady) tts?.speak(message, TextToSpeech.QUEUE_FLUSH, null, "STACKR_TTS")
              }

              override fun onInterrupt() { isRunning = false }
              override fun onDestroy() {
                  isRunning = false
                  StackrOverlayManager.hide()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          '''

          files["app/src/main/java/com/builttoearn/stackr/MileageService.kt"] = r'''package com.builttoearn.stackr

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import com.google.android.gms.location.LocationCallback
          import com.google.android.gms.location.LocationRequest
          import com.google.android.gms.location.LocationResult
          import com.google.android.gms.location.LocationServices
          import com.google.android.gms.location.Priority

          // Mileage tracker: foreground service while a route is active. Feeds GPS
          // fixes to RouteStackEngine, which accumulates real driven miles and checks
          // arrival proximity. Started/stopped by the accessibility service via the
          // engine's onRouteActiveChanged callback. If location permission is denied,
          // the engine reports "location off" and offers keep working.
          class MileageService : Service() {
              private var fused: com.google.android.gms.location.FusedLocationProviderClient? = null
              private var callback: LocationCallback? = null

              override fun onCreate() {
                  super.onCreate()
                  val channelId = "stackr_mileage"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "STACKR mileage tracking", NotificationManager.IMPORTANCE_LOW)
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
                  }
                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("STACKR tracking miles")
                      .setContentText("Mileage counts while your route is active.")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setOngoing(true)
                      .build()
                  startForeground(101, notification)
                  fused = LocationServices.getFusedLocationProviderClient(this)
                  // v2.3.1 PERF: 15s fixes instead of 5s. The engine ignores
                  // moves under 10m and drops fixes under 0.006 mi anyway,
                  // so 5s polling only burned battery. Accuracy stays HIGH
                  // because mileage math needs real fixes.
                  val request = LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 15000L)
                      .setMinUpdateDistanceMeters(10f)
                      .build()
                  callback = object : LocationCallback() {
                      override fun onLocationResult(result: LocationResult) {
                          val loc = result.lastLocation ?: return
                          RouteStackEngine.onLocationUpdate(loc.latitude, loc.longitude)
                      }
                  }
                  if (ActivityCompat.checkSelfPermission(this, android.Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                      try { fused?.requestLocationUpdates(request, callback!!, mainLooper) } catch (_: Exception) {}
                  } else {
                      RouteStackEngine.mileageAvailable = false
                      RouteStackEngine.mileageStatus = "location off"
                  }
              }

              override fun onDestroy() {
                  try { callback?.let { fused?.removeLocationUpdates(it) } } catch (_: Exception) {}
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              companion object {
                  fun start(context: Context) {
                      try {
                          val intent = Intent(context, MileageService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(intent)
                          else context.startService(intent)
                      } catch (_: Exception) {}
                  }
                  fun stop(context: Context) {
                      try { context.stopService(Intent(context, MileageService::class.java)) } catch (_: Exception) {}
                  }
              }
          }
          '''

          files["app/src/main/java/com/builttoearn/stackr/StackrEvents.kt"] = r'''package com.builttoearn.stackr

          import kotlinx.coroutines.flow.MutableSharedFlow
          import kotlinx.coroutines.flow.SharedFlow
          import kotlinx.coroutines.flow.asSharedFlow

          // v2.3.2 (#4): the log channel. The service, the engine callbacks
          // and MainActivity used to pass the latest log line around as a
          // static string (StackrAccessibilityService.lastLogMessage) — no
          // delivery guarantee, overwrites, stale after the service dies.
          // A SharedFlow with replay=1 keeps the latest line for any new
          // collector and delivers every new line in order. No DI framework
          // needed — one object, tryEmit is thread-safe from any thread.
          object StackrEvents {
              private val _log = MutableSharedFlow<String>(replay = 1, extraBufferCapacity = 32)
              val log: SharedFlow<String> = _log.asSharedFlow()

              init {
                  _log.tryEmit("Waiting for incoming offer behind Waze...")
              }

              fun postLog(msg: String) {
                  _log.tryEmit(msg)
              }
          }
          '''

          files["app/src/main/java/com/builttoearn/stackr/MainActivity.kt"] = r'''package com.builttoearn.stackr

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.location.LocationListener
          import android.location.LocationManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.widget.Button
          import android.widget.EditText
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.core.app.ActivityCompat
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.launch
          import java.util.Locale

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {
              private lateinit var statusBadge: TextView
              private lateinit var overlayBadge: TextView
              private lateinit var lastEventText: TextView
              private lateinit var routeSummaryText: TextView
              private lateinit var stopsListText: TextView
              private var localTts: TextToSpeech? = null
              private var simStep = 0
              // v2.3.2 (#1): the four switches are fields now so refreshUi()
              // can re-sync them from engine state whenever the background
              // service changes something — they used to be onCreate locals
              // set once and never updated again.
              private lateinit var switchOverlay: Switch
              private lateinit var switchAutoAccept: Switch
              private lateinit var switchWaze: Switch
