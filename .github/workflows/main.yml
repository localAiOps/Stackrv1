          files["app/src/main/java/com/builttoearn/stackr/RouteStackEngine.kt"] = r'''package com.builttoearn.stackr

          import java.util.Calendar
          import java.util.Locale
          import kotlin.math.*

          data class Waypoint(
              val stopId: String,
              val orderId: String,
              val platform: String,
              val stopType: String,
              val label: String,
              val lat: Double,
              val lng: Double,
              val deadlineMs: Long,
              val dwellMins: Double,
              val payout: Double = 0.0
          )

          data class EvaluationResult(
              val verdict: String,
              val mode: String,
              val autoAccept: Boolean,
              val orderId: String,
              val payout: Double,
              val metricPerMile: Double,
              val metricPerHour: Double,
              val slaBufferMins: Double,
              val reason: String,
              val ttsSpeech: String,
              val wazeNavUrl: String,
              val optimizedStops: List<String>
          )

          object RouteStackEngine {
              var anchorMinPerMile = 1.75
              var anchorMinPerHour = 35.00
              var marginalMinPerMile = 2.00
              var marginalMinPerHour = 38.00
              var slaSafetyBufferMins = 5.0
              var pickupDwellMins = 4.0
              var dropoffDwellMins = 2.0
              var fallbackAvgMph = 32.0
              var roadTortuosity = 1.32
              var deadheadReturnMph = 35.0

              var autoAcceptEnabled = true
              var autoLaunchWaze = true
              var deadheadMode = false

              var driverLat = 39.9612
              var driverLng = -82.9988

              val activeWaypoints = mutableListOf<Waypoint>()
              private var pendingCandidateStops: List<Waypoint>? = null
              private var pendingCandidateOrderId: String? = null

              val columbusZones: Map<String, Pair<Double, Double>> = mapOf(
                  "downtown" to Pair(39.9612, -82.9988),
                  "short north" to Pair(39.9774, -83.0033),
                  "osu" to Pair(40.0067, -83.0305),
                  "campus" to Pair(40.0067, -83.0305),
                  "clintonville" to Pair(40.0326, -83.0216),
                  "german village" to Pair(39.9448, -82.9927),
                  "harmon" to Pair(39.9415, -83.0258),
                  "franklinton" to Pair(39.9575, -83.0250),
                  "grandview" to Pair(39.9806, -83.0405),
                  "upper arlington" to Pair(40.0256, -83.0630),
                  "dublin" to Pair(40.0992, -83.1141),
                  "polaris" to Pair(40.1456, -82.9810),
                  "westerville" to Pair(40.1262, -82.9291),
                  "easton" to Pair(40.0506, -82.9152),
                  "gahanna" to Pair(40.0192, -82.8793),
                  "reynoldsburg" to Pair(39.9548, -82.8121),
                  "bexley" to Pair(39.9690, -82.9377),
                  "whitehall" to Pair(39.9670, -82.8855),
                  "hilliard" to Pair(40.0334, -83.1582),
                  "grove city" to Pair(39.8815, -83.0930),
                  "groveport" to Pair(39.8520, -82.8857),
                  "canal winchester" to Pair(39.8431, -82.8055),
                  "new albany" to Pair(40.0812, -82.8088)
              )

              fun activeOrderCount(): Int = activeWaypoints.map { it.orderId }.distinct().size
              fun totalLockedPayout(): Double = activeWaypoints.filter { it.stopType == "DROPOFF" }.sumOf { it.payout }

              fun haversineMiles(lat1: Double, lng1: Double, lat2: Double, lng2: Double): Double {
                  val r = 3958.8
                  val phi1 = Math.toRadians(lat1)
                  val phi2 = Math.toRadians(lat2)
                  val dPhi = Math.toRadians(lat2 - lat1)
                  val dLambda = Math.toRadians(lng2 - lng1)
                  val a = sin(dPhi / 2).pow(2.0) + cos(phi1) * cos(phi2) * sin(dLambda / 2).pow(2.0)
                  return 2.0 * r * atan2(sqrt(a), sqrt(1.0 - a))
              }

              fun routeLeg(lat1: Double, lng1: Double, lat2: Double, lng2: Double): Pair<Double, Double> {
                  if (abs(lat1 - lat2) < 1e-5 && abs(lng1 - lng2) < 1e-5) return Pair(0.0, 0.0)
                  val crow = haversineMiles(lat1, lng1, lat2, lng2)
                  val miles = crow * roadTortuosity
                  val mins = (miles / fallbackAvgMph) * 60.0
                  return Pair(miles, mins)
              }

              fun resolveCoords(label: String?, fallbackLat: Double, fallbackLng: Double): Pair<Double, Double> {
                  if (label.isNullOrBlank()) return Pair(fallbackLat, fallbackLng)
                  val lower = label.trim().lowercase(Locale.US)
                  columbusZones[lower]?.let { return it }
                  for ((zone, coords) in columbusZones) {
                      if (lower.contains(zone)) return coords
                  }
                  return Pair(fallbackLat, fallbackLng)
              }

              private data class SimStats(
                  val totalMiles: Double,
                  val totalMins: Double,
                  val minSlackMins: Double,
                  val slaSafe: Boolean
              )

              private fun simulateSequence(seq: List<Waypoint>, nowMs: Long): SimStats {
                  var curLat = driverLat
                  var curLng = driverLng
                  var curT = nowMs.toDouble()
                  var totalMiles = 0.0
                  var minSlack = Double.POSITIVE_INFINITY

                  for (wp in seq) {
                      val (legMi, legMin) = routeLeg(curLat, curLng, wp.lat, wp.lng)
                      totalMiles += legMi
                      curT += legMin * 60_000.0
                      val slackMins = (wp.deadlineMs - curT) / 60_000.0
                      if (slackMins < minSlack) minSlack = slackMins
                      curT += wp.dwellMins * 60_000.0
                      curLat = wp.lat
                      curLng = wp.lng
                  }

                  val totalMins = (curT - nowMs) / 60_000.0
                  val effectiveSlack = if (minSlack.isInfinite()) 99.0 else minSlack
                  return SimStats(totalMiles, totalMins, effectiveSlack, effectiveSlack >= slaSafetyBufferMins)
              }

              private fun isValidTopology(seq: List<Waypoint>): Boolean {
                  val pendingPickups = seq.filter { it.stopType == "PICKUP" }.map { it.orderId }.toSet()
                  val pickedUp = mutableSetOf<String>()
                  for (wp in seq) {
                      if (wp.stopType == "PICKUP") pickedUp.add(wp.orderId)
                      else if (wp.stopType == "DROPOFF" && wp.orderId in pendingPickups && wp.orderId !in pickedUp) return false
                  }
                  return true
              }

              private fun <T> permutations(items: List<T>): List<List<T>> {
                  if (items.size <= 1) return listOf(items)
                  val result = mutableListOf<List<T>>()
                  for (i in items.indices) {
                      val elem = items[i]
                      val rest = items.filterIndexed { idx, _ -> idx != i }
                      for (perm in permutations(rest)) result.add(listOf(elem) + perm)
                  }
                  return result
              }

              fun evaluateRawScreenText(rawText: String, packageName: String, nowMs: Long = System.currentTimeMillis()): EvaluationResult? {
                  val clean = rawText.replace("\\s+".toRegex(), " ").trim()
                  val lower = clean.lowercase(Locale.US)
                  val platform = when {
                      packageName.contains("doordash") || lower.contains("dasher") -> "DoorDash"
                      packageName.contains("grubhub") || lower.contains("grubhub") -> "GrubHub"
                      packageName.contains("uber") -> "UberEats"
                      else -> "Delivery"
                  }
                  val payMatch = Regex("""\$\s*(\d+(?:\.\d{1,2})?)""").find(clean) ?: return null
                  val payout = payMatch.groupValues[1].toDoubleOrNull() ?: return null
                  if (payout <= 0.0) return null

                  val miMatch = Regex("""(\d+(?:\.\d+)?)\s*(?:mi|miles?)\b""").find(lower)
                  val standaloneMiles = miMatch?.groupValues?.get(1)?.toDoubleOrNull() ?: 0.0
                  val minMatch = Regex("""(\d+)\s*(?:min|mins|minutes?)\b""").find(lower)
                  val standaloneMins = minMatch?.groupValues?.get(1)?.toDoubleOrNull()
                      ?: if (standaloneMiles > 0) (standaloneMiles / fallbackAvgMph) * 60.0 else 0.0

                  val matchedZones = columbusZones.keys.filter { lower.contains(it) }
                  val pickupLabel = matchedZones.getOrNull(0)?.replaceFirstChar { it.uppercase() } ?: "Pickup"
                  val dropoffLabel = matchedZones.getOrNull(1)?.replaceFirstChar { it.uppercase() } ?: pickupLabel

                  return evaluateStructuredOffer(
                      platform = platform,
                      payout = payout,
                      standaloneMiles = standaloneMiles,
                      standaloneMins = standaloneMins,
                      pickupLabel = pickupLabel,
                      dropoffLabel = dropoffLabel,
                      pickupDueMins = 12.0,
                      dropoffDueMins = max(standaloneMins + 12.0, 28.0),
                      nowMs = nowMs
                  )
              }

              fun evaluateStructuredOffer(
                  platform: String,
                  payout: Double,
                  standaloneMiles: Double,
                  standaloneMins: Double,
                  pickupLabel: String,
                  dropoffLabel: String,
                  pickupDueMins: Double = 14.0,
                  dropoffDueMins: Double = 38.0,
                  nowMs: Long = System.currentTimeMillis()
              ): EvaluationResult {
                  val (pLat, pLng) = resolveCoords(pickupLabel, driverLat, driverLng)
                  val (dLat, dLng) = resolveCoords(dropoffLabel, pLat, pLng)

                  var estMiles = standaloneMiles
                  var estMins = standaloneMins
                  if (estMiles <= 0.0) {
                      val (l1Mi, l1Min) = routeLeg(driverLat, driverLng, pLat, pLng)
                      val (l2Mi, l2Min) = routeLeg(pLat, pLng, dLat, dLng)
                      estMiles = max(0.5, l1Mi + l2Mi)
                      estMins = max(5.0, l1Min + l2Min + pickupDwellMins)
                  }

                  val orderId = "${platform.take(2).uppercase(Locale.US)}-${(nowMs / 1000L) % 100000}"
                  val newPickup = Waypoint("$orderId-P", orderId, platform, "PICKUP", pickupLabel, pLat, pLng, nowMs + (pickupDueMins * 60_000.0).toLong(), pickupDwellMins)
                  val newDropoff = Waypoint("$orderId-D", orderId, platform, "DROPOFF", dropoffLabel, dLat, dLng, nowMs + (dropoffDueMins * 60_000.0).toLong(), dropoffDwellMins, payout)

                  if (activeWaypoints.isEmpty()) {
                      val effMiles = if (deadheadMode) estMiles * 2.0 else estMiles
                      val returnMins = (estMiles / deadheadReturnMph) * 60.0
                      val effMins = if (deadheadMode) estMins + returnMins else estMins
                      val perMile = payout / max(0.1, effMiles)
                      val perHour = payout / max(0.05, effMins / 60.0)
                      val passes = perMile >= anchorMinPerMile && perHour >= anchorMinPerHour
                      val candidateSeq = listOf(newPickup, newDropoff)
                      if (passes) {
                          pendingCandidateOrderId = orderId
                          pendingCandidateStops = candidateSeq
                      }
                      val autoAccept = passes && autoAcceptEnabled
                      val reason = if (passes) String.format(Locale.US, "$%.2f/mi • $%.0f/hr (Anchor)", perMile, perHour)
                      else String.format(Locale.US, "Below floor ($%.2f/mi • $%.0f/hr)", perMile, perHour)
                      val tts = if (passes) String.format(Locale.US, "Stack anchor. %.2f dollars, %.2f per mile.", payout, perMile)
                      else String.format(Locale.US, "Skip. %.2f per mile.", perMile)

                      return EvaluationResult(
                          verdict = if (passes) "STACK" else "SKIP",
                          mode = "ANCHOR",
                          autoAccept = autoAccept,
                          orderId = orderId,
                          payout = payout,
                          metricPerMile = perMile,
                          metricPerHour = perHour,
                          slaBufferMins = dropoffDueMins - estMins,
                          reason = reason,
                          ttsSpeech = tts,
                          wazeNavUrl = "https://waze.com/ul?ll=${newPickup.lat},${newPickup.lng}&navigate=yes",
                          optimizedStops = candidateSeq.map { "${it.stopType}: ${it.label}" }
                      )
                  }

                  val baseline = simulateSequence(activeWaypoints, nowMs)
                  val allStops = activeWaypoints + listOf(newPickup, newDropoff)
                  var bestEval: SimStats? = null
                  var bestSeq: List<Waypoint>? = null

                  for (seq in permutations(allStops)) {
                      if (!isValidTopology(seq)) continue
                      val sim = simulateSequence(seq, nowMs)
                      if (!sim.slaSafe) continue
                      if (bestEval == null || sim.totalMins < bestEval.totalMins) {
                          bestEval = sim
                          bestSeq = seq
                      }
                  }

                  if (bestEval == null || bestSeq == null) {
                      return EvaluationResult(
                          verdict = "SKIP",
                          mode = "SLA_BLOCK",
                          autoAccept = false,
                          orderId = orderId,
                          payout = payout,
                          metricPerMile = 0.0,
                          metricPerHour = 0.0,
                          slaBufferMins = 0.0,
                          reason = "SLA Guardrail: Detour risks late stop",
                          ttsSpeech = "Skip. Off corridor or risks late delivery.",
                          wazeNavUrl = "",
                          optimizedStops = activeWaypoints.map { "${it.stopType}: ${it.label}" }
                      )
                  }

                  val marginalMiles = max(0.15, bestEval.totalMiles - baseline.totalMiles)
                  val marginalMins = max(1.5, bestEval.totalMins - baseline.totalMins)
                  val margPerMile = payout / marginalMiles
                  val margPerHour = payout / (marginalMins / 60.0)
                  val passesStack = margPerMile >= marginalMinPerMile && margPerHour >= marginalMinPerHour
                  val autoAccept = passesStack && autoAcceptEnabled
                  val nextStop = bestSeq.first()

                  if (passesStack) {
                      pendingCandidateOrderId = orderId
                      pendingCandidateStops = bestSeq
                  }

                  val reason = if (passesStack) String.format(Locale.US, "+%.1f mi • $%.2f/marg mi • %.0fm cushion", marginalMiles, margPerMile, bestEval.minSlackMins)
                  else String.format(Locale.US, "+%.1f detour mi ($%.2f/marg mi)", marginalMiles, margPerMile)
                  val tts = if (passesStack) String.format(Locale.US, "Stack add-on, %.2f dollars. Adds %.1f miles.", payout, marginalMiles)
                  else String.format(Locale.US, "Skip. Adds %.1f detour miles.", marginalMiles)

                  return EvaluationResult(
                      verdict = if (passesStack) "STACK" else "SKIP",
                      mode = "ON-CORRIDOR",
                      autoAccept = autoAccept,
                      orderId = orderId,
                      payout = payout,
                      metricPerMile = margPerMile,
                      metricPerHour = margPerHour,
                      slaBufferMins = bestEval.minSlackMins,
                      reason = reason,
                      ttsSpeech = tts,
                      wazeNavUrl = "https://waze.com/ul?ll=${nextStop.lat},${nextStop.lng}&navigate=yes",
                      optimizedStops = bestSeq.map { "${it.stopType}: ${it.label}" }
                  )
              }

              fun commitPendingCandidate(orderId: String? = null): Boolean {
                  val stops = pendingCandidateStops ?: return false
                  if (orderId != null && pendingCandidateOrderId != orderId) return false
                  activeWaypoints.clear()
                  activeWaypoints.addAll(stops)
                  pendingCandidateStops = null
                  pendingCandidateOrderId = null
                  return true
              }

              fun clearPendingCandidate() {
                  pendingCandidateStops = null
                  pendingCandidateOrderId = null
              }

              fun completeNextStop(): String {
                  if (activeWaypoints.isEmpty()) return "No active stops."
                  val done = activeWaypoints.removeAt(0)
                  return if (activeWaypoints.isEmpty()) "Completed ${done.stopType}: ${done.label}. Route complete."
                  else "Completed ${done.stopType}: ${done.label}. Next -> ${activeWaypoints.first().label}"
              }

              fun resetRoute() {
                  activeWaypoints.clear()
                  pendingCandidateStops = null
                  pendingCandidateOrderId = null
              }
          }
          '''

          files["app/src/main/java/com/builttoearn/stackr/StackrOverlayManager.kt"] = r'''package com.builttoearn.stackr

          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Locale
          import kotlin.math.abs

          @SuppressLint("StaticFieldLeak")
          object StackrOverlayManager {
              var isOverlayEnabled = true
              var autoAcceptCountdownSecs = 3

              private var windowManager: WindowManager? = null
              private var rootView: View? = null
              private var layoutParams: WindowManager.LayoutParams? = null
              private val mainHandler = Handler(Looper.getMainLooper())
              private var activeFlashRunnable: Runnable? = null

              var onUserInteractionCallback: ((String) -> Unit)? = null

              fun show(context: Context) {
                  if (!isOverlayEnabled || !Settings.canDrawOverlays(context)) return
                  mainHandler.post {
                      if (rootView != null) {
                          refreshPill()
                          return@post
                      }
                      try {
                          val appCtx = context.applicationContext
                          val wm = appCtx.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                          val view = LayoutInflater.from(appCtx).inflate(R.layout.overlay_hud, null)
                          val overlayType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE

                          val params = WindowManager.LayoutParams(
                              WindowManager.LayoutParams.WRAP_CONTENT,
                              WindowManager.LayoutParams.WRAP_CONTENT,
                              overlayType,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                              PixelFormat.TRANSLUCENT
                          ).apply {
                              gravity = Gravity.TOP or Gravity.START
                              x = 28
                              y = 240
                          }

                          setupTouchAndDrag(appCtx, view, wm, params)
                          wm.addView(view, params)
                          windowManager = wm
                          rootView = view
                          layoutParams = params
                          refreshPill()
                      } catch (_: Exception) {}
                  }
              }

              fun hide() {
                  mainHandler.post {
                      activeFlashRunnable?.let { mainHandler.removeCallbacks(it) }
                      activeFlashRunnable = null
                      try {
                          if (rootView != null && windowManager != null) windowManager?.removeView(rootView)
                      } catch (_: Exception) {} finally {
                          rootView = null
                          windowManager = null
                          layoutParams = null
                      }
                  }
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupTouchAndDrag(appCtx: Context, view: View, wm: WindowManager, params: WindowManager.LayoutParams) {
                  val pillContainer = view.findViewById<LinearLayout>(R.id.pillContainer)
                  var initialX = 0
                  var initialY = 0
                  var initialTouchX = 0f
                  var initialTouchY = 0f
                  var touchDownTime = 0L

                  pillContainer.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              touchDownTime = System.currentTimeMillis()
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = initialX + (event.rawX - initialTouchX).toInt()
                              params.y = initialY + (event.rawY - initialTouchY).toInt()
                              try { wm.updateViewLayout(view, params) } catch (_: Exception) {}
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              val dx = abs(event.rawX - initialTouchX)
                              val dy = abs(event.rawY - initialTouchY)
                              val elapsed = System.currentTimeMillis() - touchDownTime
                              if (dx < 14f && dy < 14f) {
                                  if (elapsed >= 450L) {
                                      RouteStackEngine.autoAcceptEnabled = !RouteStackEngine.autoAcceptEnabled
                                      refreshPill()
                                      onUserInteractionCallback?.invoke(if (RouteStackEngine.autoAcceptEnabled) "Auto-Accept enabled" else "Co-Pilot mode")
                                  } else if (RouteStackEngine.activeWaypoints.isNotEmpty()) {
                                      val msg = RouteStackEngine.completeNextStop()
                                      refreshPill()
                                      onUserInteractionCallback?.invoke(msg)
                                      val nxt = RouteStackEngine.activeWaypoints.firstOrNull()
                                      if (nxt != null && RouteStackEngine.autoLaunchWaze) {
                                          launchWaze(appCtx, "https://waze.com/ul?ll=${nxt.lat},${nxt.lng}&navigate=yes")
                                      }
                                  }
                              }
                              true
                          }
                          else -> false
                      }
                  }
              }

              fun refreshPill() {
                  mainHandler.post {
                      val view = rootView ?: return@post
                      val dot = view.findViewById<TextView>(R.id.overlayDot)
                      val title = view.findViewById<TextView>(R.id.overlayPillTitle)
                      val sub = view.findViewById<TextView>(R.id.overlayPillSub)

                      if (RouteStackEngine.activeWaypoints.isNotEmpty()) {
                          val nextStop = RouteStackEngine.activeWaypoints.first()
                          dot.setTextColor(0xFF19C37D.toInt())
                          title.text = String.format(Locale.US, "$%.2f • %d ORD", RouteStackEngine.totalLockedPayout(), RouteStackEngine.activeOrderCount())
                          sub.text = "Next: ${nextStop.label}"
                      } else {
                          val autoOn = RouteStackEngine.autoAcceptEnabled
                          dot.setTextColor(if (autoOn) 0xFF19C37D.toInt() else 0xFFFFCC4D.toInt())
                          title.text = if (autoOn) "STACKR • AUTO" else "STACKR • PILOT"
                          sub.text = String.format(Locale.US, "$%.2f/m • $%.0f/h", RouteStackEngine.anchorMinPerMile, RouteStackEngine.anchorMinPerHour)
                      }
                  }
              }

              fun showVerdictFlash(context: Context, result: EvaluationResult, onConfirmAutoAccept: (() -> Unit)? = null) {
                  if (!isOverlayEnabled || !Settings.canDrawOverlays(context)) return
                  if (rootView == null) show(context)

                  mainHandler.post {
                      val view = rootView ?: return@post
                      activeFlashRunnable?.let { mainHandler.removeCallbacks(it) }

                      val pillContainer = view.findViewById<LinearLayout>(R.id.pillContainer)
                      val flashContainer = view.findViewById<LinearLayout>(R.id.flashContainer)
                      val flashTitle = view.findViewById<TextView>(R.id.flashTitle)
                      val flashBadge = view.findViewById<TextView>(R.id.flashBadge)
                      val flashReason = view.findViewById<TextView>(R.id.flashReason)
                      val flashNextStop = view.findViewById<TextView>(R.id.flashNextStop)
                      val flashActionRow = view.findViewById<LinearLayout>(R.id.flashActionRow)
                      val flashCountdown = view.findViewById<TextView>(R.id.flashCountdown)
                      val btnCancel = view.findViewById<TextView>(R.id.btnFlashCancel)

                      val isStack = result.verdict == "STACK"
                      flashContainer.setBackgroundResource(if (isStack) R.drawable.bg_flash_stack else R.drawable.bg_flash_skip)
                      flashTitle.setTextColor(if (isStack) 0xFF19C37D.toInt() else 0xFFFF4D4F.toInt())
                      flashTitle.text = String.format(Locale.US, "%s • $%.2f", result.verdict, result.payout)
                      flashBadge.text = result.mode
                      flashReason.text = result.reason
                      flashNextStop.text = result.optimizedStops.firstOrNull()?.let { "Next: $it" } ?: ""

                      pillContainer.visibility = View.GONE
                      flashContainer.visibility = View.VISIBLE

                      if (isStack && result.autoAccept && onConfirmAutoAccept != null) {
                          flashActionRow.visibility = View.VISIBLE
                          var cancelled = false
                          var secondsLeft = autoAcceptCountdownSecs

                          btnCancel.setOnClickListener {
                              cancelled = true
                              activeFlashRunnable?.let { mainHandler.removeCallbacks(it) }
                              RouteStackEngine.clearPendingCandidate()
                              flashCountdown.setTextColor(0xFFFF4D4F.toInt())
                              flashCountdown.text = "✕ CANCELLED BY DRIVER"
                              scheduleCollapse(1400L)
                          }

                          val tickRunnable = object : Runnable {
                              override fun run() {
                                  if (cancelled) return
                                  if (secondsLeft > 0) {
                                      flashCountdown.setTextColor(0xFF19C37D.toInt())
                                      flashCountdown.text = "Auto-accepting in ${secondsLeft}s..."
                                      secondsLeft--
                                      mainHandler.postDelayed(this, 1000L)
                                  } else {
                                      onConfirmAutoAccept.invoke()
                                      flashCountdown.setTextColor(0xFF19C37D.toInt())
                                      flashCountdown.text = "✓ ACCEPTED & ROUTED"
                                      scheduleCollapse(1400L)
                                  }
                              }
                          }
                          activeFlashRunnable = tickRunnable
                          mainHandler.post(tickRunnable)
                      } else {
                          flashActionRow.visibility = View.GONE
                          scheduleCollapse(4200L)
                      }
                  }
              }

              private fun scheduleCollapse(delayMs: Long) {
                  val collapseRunnable = Runnable {
                      val view = rootView ?: return@Runnable
                      view.findViewById<LinearLayout>(R.id.flashContainer).visibility = View.GONE
                      view.findViewById<LinearLayout>(R.id.pillContainer).visibility = View.VISIBLE
                      refreshPill()
                  }
                  activeFlashRunnable = collapseRunnable
                  mainHandler.postDelayed(collapseRunnable, delayMs)
              }

              private fun launchWaze(context: Context, url: String) {
                  try {
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                      context.startActivity(intent)
                  } catch (_: Exception) {}
              }
          }
          '''

          files["app/src/main/java/com/builttoearn/stackr/StackrAccessibilityService.kt"] = r'''package com.builttoearn.stackr

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.net.Uri
          import android.speech.tts.TextToSpeech
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.util.Locale

          class StackrAccessibilityService : AccessibilityService(), TextToSpeech.OnInitListener {
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var lastEvaluatedHash = 0
              private var lastEvaluatedTimeMs = 0L
              private var lastCompletionTimeMs = 0L

              companion object {
                  var isRunning = false
                  var lastLogMessage = "Waiting for incoming offer behind Waze..."
                  var onStateUpdated: (() -> Unit)? = null
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  isRunning = true
                  tts = TextToSpeech(this, this)
                  lastLogMessage = "Agent Active • Listening behind Waze"
                  StackrOverlayManager.onUserInteractionCallback = { msg ->
                      lastLogMessage = msg
                      speak(msg)
                      onStateUpdated?.invoke()
                  }
                  StackrOverlayManager.show(this)
                  onStateUpdated?.invoke()
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale.US
                      ttsReady = true
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val root = rootInActiveWindow ?: return
                  val pkg = event?.packageName?.toString() ?: return
                  val collectedText = StringBuilder()
                  var hasAcceptButton = false
                  var isStopCompletionScreen = false

                  fun traverse(node: AccessibilityNodeInfo?) {
                      if (node == null) return
                      val txt = node.text?.toString()?.trim()
                      if (!txt.isNullOrEmpty()) {
                          collectedText.append(txt).append(" ")
                          val lower = txt.lowercase(Locale.US)
                          if (lower == "accept" || lower == "accept order" || lower == "accept delivery") hasAcceptButton = true
                          if (lower.contains("confirm pickup") || lower.contains("complete delivery") || lower.contains("dropoff complete")) isStopCompletionScreen = true
                      }
                      for (i in 0 until node.childCount) traverse(node.getChild(i))
                  }

                  traverse(root)
                  val fullText = collectedText.toString().trim()
                  val now = System.currentTimeMillis()

                  if (hasAcceptButton && fullText.contains("$")) {
                      val hash = fullText.hashCode()
                      if (hash == lastEvaluatedHash && (now - lastEvaluatedTimeMs) < 12_000L) return
                      lastEvaluatedHash = hash
                      lastEvaluatedTimeMs = now

                      val result = RouteStackEngine.evaluateRawScreenText(fullText, pkg, now) ?: return
                      lastLogMessage = "[${result.verdict}] ${result.reason}"
                      speak(result.ttsSpeech)

                      val executeAccept: (() -> Unit)? = if (result.verdict == "STACK" && result.autoAccept) {
                          {
                              val freshAcceptNode = findAcceptNode(rootInActiveWindow)
                              if (clickNodeOrParent(freshAcceptNode)) {
                                  RouteStackEngine.commitPendingCandidate(result.orderId)
                                  lastLogMessage = "[AUTO-ACCEPTED] ${result.reason}"
                                  StackrOverlayManager.refreshPill()
                                  if (RouteStackEngine.autoLaunchWaze && result.wazeNavUrl.isNotEmpty()) launchWaze(result.wazeNavUrl)
                              }
                              onStateUpdated?.invoke()
                          }
                      } else null

                      StackrOverlayManager.showVerdictFlash(this, result, executeAccept)
                      onStateUpdated?.invoke()
                      return
                  }

                  if (isStopCompletionScreen && RouteStackEngine.activeWaypoints.isNotEmpty() && (now - lastCompletionTimeMs) > 15_000L) {
                      lastCompletionTimeMs = now
                      val msg = RouteStackEngine.completeNextStop()
                      lastLogMessage = msg
                      speak(msg)
                      StackrOverlayManager.refreshPill()
                      val nextWp = RouteStackEngine.activeWaypoints.firstOrNull()
                      if (nextWp != null && RouteStackEngine.autoLaunchWaze) launchWaze("https://waze.com/ul?ll=${nextWp.lat},${nextWp.lng}&navigate=yes")
                      onStateUpdated?.invoke()
                  }
              }

              private fun findAcceptNode(root: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (root == null) return null
                  val txt = root.text?.toString()?.trim()?.lowercase(Locale.US)
                  if (txt == "accept" || txt == "accept order" || txt == "accept delivery") return root
                  for (i in 0 until root.childCount) {
                      val found = findAcceptNode(root.getChild(i))
                      if (found != null) return found
                  }
                  return null
              }

              private fun clickNodeOrParent(node: AccessibilityNodeInfo?): Boolean {
                  var cur = node
                  var depth = 0
                  while (cur != null && depth < 5) {
                      if (cur.isClickable) return cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      cur = cur.parent
                      depth++
                  }
                  return false
              }

              private fun launchWaze(url: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                  } catch (_: Exception) {}
              }

              fun speak(message: String) {
                  if (ttsReady) tts?.speak(message, TextToSpeech.QUEUE_FLUSH, null, "STACKR_TTS")
              }

              override fun onInterrupt() { isRunning = false }
              override fun onDestroy() {
                  isRunning = false
                  StackrOverlayManager.hide()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          '''

          files["app/src/main/java/com/builttoearn/stackr/MainActivity.kt"] = r'''package com.builttoearn.stackr

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.location.LocationListener
          import android.location.LocationManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.widget.Button
          import android.widget.Switch
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.util.Locale

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {
              private lateinit var statusBadge: TextView
              private lateinit var overlayBadge: TextView
              private lateinit var lastEventText: TextView
              private lateinit var routeSummaryText: TextView
              private lateinit var stopsListText: TextView
              private var localTts: TextToSpeech? = null
              private var simStep = 0

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  localTts = TextToSpeech(this, this)

                  statusBadge = findViewById(R.id.statusBadge)
                  overlayBadge = findViewById(R.id.overlayBadge)
                  lastEventText = findViewById(R.id.lastEventText)
                  routeSummaryText = findViewById(R.id.routeSummaryText)
                  stopsListText = findViewById(R.id.stopsListText)

                  val btnAccessibility = findViewById<Button>(R.id.btnEnableAccessibility)
                  val btnOverlayPerm = findViewById<Button>(R.id.btnEnableOverlay)
                  val switchOverlay = findViewById<Switch>(R.id.switchOverlay)
                  val switchAutoAccept = findViewById<Switch>(R.id.switchAutoAccept)
                  val switchWaze = findViewById<Switch>(R.id.switchWaze)
                  val switchDeadhead = findViewById<Switch>(R.id.switchDeadhead)
                  val btnCompleteStop = findViewById<Button>(R.id.btnCompleteStop)
                  val btnResetRoute = findViewById<Button>(R.id.btnResetRoute)
                  val btnSimulatePing = findViewById<Button>(R.id.btnSimulatePing)

                  switchOverlay.isChecked = StackrOverlayManager.isOverlayEnabled
                  switchAutoAccept.isChecked = RouteStackEngine.autoAcceptEnabled
                  switchWaze.isChecked = RouteStackEngine.autoLaunchWaze
                  switchDeadhead.isChecked = RouteStackEngine.deadheadMode

                  switchOverlay.setOnCheckedChangeListener { _, isChecked ->
                      StackrOverlayManager.isOverlayEnabled = isChecked
                      if (isChecked) {
                          if (Settings.canDrawOverlays(this)) StackrOverlayManager.show(this)
                          else openOverlayPermissionSettings()
                      } else StackrOverlayManager.hide()
                      refreshUi()
                  }

                  switchAutoAccept.setOnCheckedChangeListener { _, isChecked ->
                      RouteStackEngine.autoAcceptEnabled = isChecked
                      StackrOverlayManager.refreshPill()
                  }
                  switchWaze.setOnCheckedChangeListener { _, isChecked -> RouteStackEngine.autoLaunchWaze = isChecked }
                  switchDeadhead.setOnCheckedChangeListener { _, isChecked -> RouteStackEngine.deadheadMode = isChecked }

                  btnAccessibility.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  btnOverlayPerm.setOnClickListener { openOverlayPermissionSettings() }

                  btnCompleteStop.setOnClickListener {
                      StackrAccessibilityService.lastLogMessage = RouteStackEngine.completeNextStop()
                      StackrOverlayManager.refreshPill()
                      refreshUi()
                  }

                  btnResetRoute.setOnClickListener {
                      RouteStackEngine.resetRoute()
                      simStep = 0
                      StackrAccessibilityService.lastLogMessage = "Route cleared • Ready for Anchor ping"
                      StackrOverlayManager.refreshPill()
                      refreshUi()
                  }

                  btnSimulatePing.setOnClickListener { runNextSimulationPing() }
                  StackrAccessibilityService.onStateUpdated = { runOnUiThread { refreshUi() } }

                  if (Settings.canDrawOverlays(this) && StackrOverlayManager.isOverlayEnabled) StackrOverlayManager.show(this)
                  requestGpsUpdates()
                  refreshUi()
              }

              private fun openOverlayPermissionSettings() {
                  startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) localTts?.language = Locale.US
              }

              override fun onResume() {
                  super.onResume()
                  if (Settings.canDrawOverlays(this) && StackrOverlayManager.isOverlayEnabled) StackrOverlayManager.show(this)
                  refreshUi()
              }

              private fun requestGpsUpdates() {
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), 101)
                      return
                  }
                  try {
                      val lm = getSystemService(LOCATION_SERVICE) as LocationManager
                      lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 5000L, 25f, LocationListener { loc ->
                          RouteStackEngine.driverLat = loc.latitude
                          RouteStackEngine.driverLng = loc.longitude
                      })
                  } catch (_: Exception) {}
              }

              private fun runNextSimulationPing() {
                  simStep = (simStep % 3) + 1
                  when (simStep) {
                      1 -> {
                          RouteStackEngine.resetRoute()
                          RouteStackEngine.driverLat = 39.9612
                          RouteStackEngine.driverLng = -82.9988
                          val res = RouteStackEngine.evaluateStructuredOffer("DoorDash", 22.50, 11.2, 22.0, "Short North", "Westerville", 14.0, 42.0)
                          StackrAccessibilityService.lastLogMessage = "[SIM 1: ${res.verdict}] ${res.reason}"
                          localTts?.speak(res.ttsSpeech, TextToSpeech.QUEUE_FLUSH, null, "SIM")
                          StackrOverlayManager.showVerdictFlash(this, res) {
                              RouteStackEngine.commitPendingCandidate(res.orderId)
                              runOnUiThread { refreshUi() }
                          }
                      }
                      2 -> {
                          if (RouteStackEngine.activeWaypoints.firstOrNull()?.stopType == "PICKUP") RouteStackEngine.completeNextStop()
                          RouteStackEngine.driverLat = 40.0280
                          RouteStackEngine.driverLng = -83.0180
                          val res = RouteStackEngine.evaluateStructuredOffer("GrubHub", 8.50, 7.4, 16.0, "Clintonville", "Westerville", 15.0, 38.0)
                          StackrAccessibilityService.lastLogMessage = "[SIM 2: ${res.verdict}] ${res.reason}"
                          localTts?.speak(res.ttsSpeech, TextToSpeech.QUEUE_FLUSH, null, "SIM")
                          StackrOverlayManager.showVerdictFlash(this, res) {
                              RouteStackEngine.commitPendingCandidate(res.orderId)
                              runOnUiThread { refreshUi() }
                          }
                      }
                      3 -> {
                          val res = RouteStackEngine.evaluateStructuredOffer("UberEats", 11.00, 9.0, 19.0, "Hilliard", "Grove City", 15.0, 35.0)
                          StackrAccessibilityService.lastLogMessage = "[SIM 3: ${res.verdict}] ${res.reason}"
                          localTts?.speak(res.ttsSpeech, TextToSpeech.QUEUE_FLUSH, null, "SIM")
                          StackrOverlayManager.showVerdictFlash(this, res, null)
                      }
                  }
                  refreshUi()
              }

              private fun refreshUi() {
                  val agentActive = StackrAccessibilityService.isRunning
                  statusBadge.text = if (agentActive) "● SCREEN AGENT LIVE" else "○ SCREEN AGENT OFF"
                  statusBadge.setTextColor(if (agentActive) 0xFF19C37D.toInt() else 0xFFFF4D4F.toInt())

                  val canOverlay = Settings.canDrawOverlays(this)
                  overlayBadge.text = if (canOverlay) "● FLOATING PILL READY" else "○ OVERLAY PERMISSION NEEDED"
                  overlayBadge.setTextColor(if (canOverlay) 0xFF19C37D.toInt() else 0xFFFFCC4D.toInt())

                  lastEventText.text = StackrAccessibilityService.lastLogMessage
                  routeSummaryText.text = String.format(Locale.US, "Active Orders: %d   •   Locked Corridor Pay: $%.2f", RouteStackEngine.activeOrderCount(), RouteStackEngine.totalLockedPayout())

                  if (RouteStackEngine.activeWaypoints.isEmpty()) {
                      stopsListText.text = "No active stops. Open Waze — floating pill will track incoming pings automatically."
                  } else {
                      val now = System.currentTimeMillis()
                      stopsListText.text = RouteStackEngine.activeWaypoints.mapIndexed { idx, wp ->
                          val rem = ((wp.deadlineMs - now) / 60_000.0).toInt()
                          "${idx + 1}. [${wp.stopType}] ${wp.label} (${wp.platform}) • due in ${rem}m"
                      }.joinToString("\n")
                  }
              }

              override fun onDestroy() {
                  localTts?.shutdown()
                  super.onDestroy()
              }
          }
          '''

          for path, content in files.items():
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")
          print("Successfully generated all 19 STACKR project files.")

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload STACKR APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STACKR-Floating-Overlay-Agent-APK
          path: app/build/outputs/apk/debug/app-debug.apk
