name: Build STACKR Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Full STACKR v2 Android Project
        shell: python3 {0}
        run: |
          import os

          dirs = [
              "app/src/main/java/com/builttoearn/stackr",
              "app/src/main/res/drawable",
              "app/src/main/res/layout",
              "app/src/main/res/values",
              "app/src/main/res/xml",
          ]
          for d in dirs:
              os.makedirs(d, exist_ok=True)

          files = {}

          files["settings.gradle.kts"] = '''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "STACKR"
          include(":app")
          '''

          files["build.gradle.kts"] = '''plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          '''

          files["gradle.properties"] = '''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          '''

          files["app/build.gradle.kts"] = '''plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.builttoearn.stackr"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.builttoearn.stackr"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0-overlay"
